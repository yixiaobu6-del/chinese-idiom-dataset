<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成语歇后语查询</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-4xl mx-auto p-4 md:p-6">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold mb-2">中文成语·歇后语查询</h1>
      <p class="text-gray-500">收录300+成语 + 150+歇后语，支持搜索、分类浏览、详解学习</p>
    </div>

    <div class="bg-white rounded-lg shadow p-4 mb-4">
      <div class="flex gap-2 mb-4">
        <div class="flex-1">
          <input type="text" id="searchInput" class="w-full border rounded px-3 py-2" placeholder="搜索成语、拼音、释义或使用场景...">
        </div>
        <button onclick="search()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
          <i class="fa fa-search"></i> 搜索
        </button>
        <button onclick="randomIdiom()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
          <i class="fa fa-random"></i> 随机
        </button>
      </div>

      <div class="flex gap-2 flex-wrap mb-2">
        <button onclick="switchTab('idiom')" id="tabIdiom" class="px-3 py-1 bg-blue-500 text-white rounded text-sm">成语</button>
        <button onclick="switchTab('xiehouyu')" id="tabXiehouyu" class="px-3 py-1 bg-gray-200 rounded text-sm">歇后语</button>
        <span class="text-sm text-gray-400 ml-2">| 热门标签：</span>
        <button onclick="searchTag('褒义')" class="px-2 py-1 bg-yellow-100 rounded text-xs hover:bg-yellow-200">褒义</button>
        <button onclick="searchTag('动物')" class="px-2 py-1 bg-green-100 rounded text-xs hover:bg-green-200">动物</button>
        <button onclick="searchTag('哲理')" class="px-2 py-1 bg-purple-100 rounded text-xs hover:bg-purple-200">哲理</button>
        <button onclick="searchTag('历史')" class="px-2 py-1 bg-red-100 rounded text-xs hover:bg-red-200">历史</button>
        <button onclick="searchTag('学习')" class="px-2 py-1 bg-blue-100 rounded text-xs hover:bg-blue-200">学习</button>
        <button onclick="searchTag('人物')" class="px-2 py-1 bg-indigo-100 rounded text-xs hover:bg-indigo-200">人物</button>
        <button onclick="showFavorites()" class="px-2 py-1 bg-pink-100 rounded text-xs hover:bg-pink-200"><i class="fa fa-heart"></i> 收藏</button>
      </div>
    </div>

    <div id="results" class="space-y-3"></div>
    <div id="singleCard" class="hidden bg-gradient-to-r from-blue-50 to-indigo-50 rounded-lg shadow p-6 text-center">
      <div id="singleWord" class="text-3xl font-bold mb-2"></div>
      <div id="singlePinyin" class="text-gray-400 mb-4"></div>
      <div id="singleMeaning" class="text-lg mb-4"></div>
      <div id="SingleExample" class="text-gray-500 italic mb-4"></div>
      <div id="singleSource" class="text-sm text-gray-400"></div>
    </div>
  </div>

  <script>
    // Built-in data — abbreviated version, imported from JSON
    const idiomData = [{"idiom":"画龙点睛","pinyin":"huà lóng diǎn jīng","meaning":"比喻在关键处用几句话点明实质，使内容更加生动有力。","source":"唐·张彦远《历代名画记》","example":"文章的结尾那句话，起到了画龙点睛的作用。","tags":["文学","技巧","比喻"],"story":"南朝梁代画家张僧繇在金陵安乐寺墙壁上画了四条龙，都不画眼睛。人们问他原因，他说画上眼睛龙就会飞走。大家不信，他刚给两条龙点上眼睛，顿时电闪雷鸣，两条龙破壁飞去。","usage":"常用于评论文章、演讲、艺术创作中关键处的精妙处理。"},{"idiom":"刻舟求剑","pinyin":"kè zhōu qiú jiàn","meaning":"比喻办事刻板拘泥，不知根据实际情况灵活变通。","source":"《吕氏春秋·察今》","example":"做事情要随机应变，不能刻舟求剑。","tags":["哲理","贬义","寓言"],"story":"楚国有人乘船渡江，剑从船上掉进水里。他赶紧在船边刻了个记号。船停后，他从刻记号的地方跳进水里找剑。船已经走了很远，而剑在原地，这样找剑不是太糊涂了吗？","usage":"适用于批评那些固守旧方法、不随环境变化调整策略的行为。"},{"idiom":"掩耳盗铃","pinyin":"yǎn ěr dào líng","meaning":"比喻自己欺骗自己，明明掩盖不住的事情偏要自欺欺人。","source":"《吕氏春秋·自知》","example":"不承认问题的存在，无异于掩耳盗铃。","tags":["贬义","哲理","寓言"],"story":"有人偷了一口钟，想背着它跑。但钟太大了，他就想砸碎它。怕别人听到声音，就捂住自己的耳朵。以为自己听不到，别人也听不到，真是自欺欺人。","usage":"用于批评那些回避现实、自欺欺人的行为。"},{"idiom":"对牛弹琴","pinyin":"duì niú tán qín","meaning":"比喻说话不看对象，或对不懂道理的人讲道理。","source":"汉·牟融《理惑论》","example":"跟他讲这些专业术语，简直是对牛弹琴。","tags":["动物","比喻","贬义"],"story":"古代音乐家公明仪对着一头牛弹奏优美的乐曲，牛却只顾低头吃草。不是音乐不好听，而是牛听不懂。","usage":"用于议论沟通对象不合适的场景，也可自嘲说话没人理解。"},{"idiom":"守株待兔","pinyin":"shǒu zhū dài tù","meaning":"比喻死守狭隘经验，不知变通，也比喻不劳而获的侥幸心理。","source":"《韩非子·五蠹》","example":"与其守株待兔，不如积极寻找机会。","tags":["寓言","贬义","哲理"],"story":"宋国有个农夫在田里干活，一只兔子跑来撞在树桩上死了。农夫不费力气就得到了兔子，于是放下农具整天守在树桩旁等兔子再来撞死。结果兔子没等到，田地却荒废了。","usage":"告诫人们不要心存侥幸，要主动努力而非被动等待。"},{"idiom":"亡羊补牢","pinyin":"wáng yáng bǔ láo","meaning":"比喻出了问题后及时补救，防止继续受损失。","source":"《战国策·楚策四》","example":"这次虽然失败了，但亡羊补牢，为时未晚。","tags":["动物","哲理","寓言"],"story":"从前有人养了一圈羊。一天羊圈破了个洞，丢了一只羊。邻居劝他赶快修补，他说羊都丢了还补什么。第二天又丢了一只，他才赶紧把羊圈修好。从此羊再也没有丢过。","usage":"用于鼓励在出现问题后及时采取措施，防止损失扩大。"},{"idiom":"画蛇添足","pinyin":"huà shé tiān zú","meaning":"比喻做了多余的事，反而不好。","source":"《战国策·齐策二》","example":"文章到这里已经很清楚，再加解释就是画蛇添足了。","tags":["动物","贬义","寓言"],"story":"几个人比赛画蛇，谁先画完谁喝酒。一人先画完，见别人还没画好，就得意地给蛇添上脚。这时另一个人画完，夺过酒壶说：蛇本来没有脚，你画的不是蛇。于是喝了酒。","usage":"用于提醒做事不要多此一举，适可而止。"},{"idiom":"井底之蛙","pinyin":"jǐng dǐ zhī wā","meaning":"比喻见识狭窄的人。","source":"《庄子·秋水》","example":"我们要开阔眼界，不能做井底之蛙。","tags":["动物","贬义","比喻"],"story":"一口废井里住着一只青蛙，它觉得自己的井底是世界上最美好的地方。一天海龟路过，告诉它大海的广阔无边。青蛙听了目瞪口呆，才知道自己见识多么有限。","usage":"常用于批评见识狭隘、目光短浅的人或自我警醒。"},{"idiom":"叶公好龙","pinyin":"yè gōng hào lóng","meaning":"比喻口头上爱好某事物，实际上并不真正爱好。","source":"汉·刘向《新序·杂事五》","example":"他说自己热爱艺术，却从不去博物馆，简直是叶公好龙。","tags":["动物","贬义","寓言"],"story":"叶公非常喜欢龙，家里到处画着龙、雕着龙。天上的真龙知道后很感动，就来到叶公家。叶公看到真龙，吓得魂飞魄散、面如土色。原来他喜欢的只是像龙的东西，不是真龙。","usage":"讽刺那些表面喜欢某事物、实际却畏惧或逃避的人。"},{"idiom":"狐假虎威","pinyin":"hú jiǎ hǔ wēi","meaning":"比喻仗着别人的势力欺压人。","source":"《战国策·楚策一》","example":"他不过是狐假虎威，没了靠山什么都不是。","tags":["动物","贬义","寓言"],"story":"老虎抓住一只狐狸想吃掉。狐狸说：我是天帝派来管理百兽的，你吃我就是违抗天命。不信你跟在我后面走一趟。老虎就跟在狐狸后面走，果然动物们都吓跑了。老虎不知道动物怕的是自己，还以为是怕狐狸。","usage":"用于批评那些倚仗他人权势作威作福的人。"},{"idiom":"鹤立鸡群","pinyin":"hè lì jī qún","meaning":"比喻一个人的才能或仪表在一群人里显得很突出。","source":"晋·戴逵《竹林七贤论》","example":"她在参赛选手中鹤立鸡群，才华出众。","tags":["动物","褒义","比喻"]},{"idiom":"杯弓蛇影","pinyin":"bēi gōng shé yǐng","meaning":"比喻疑神疑鬼，自己吓自己。","source":"汉·应劭《风俗通义》","example":"你别杯弓蛇影的，那只是窗外的树影。","tags":["动物","心理","贬义"]},{"idiom":"杞人忧天","pinyin":"qǐ rén yōu tiān","meaning":"比喻不必要的或毫无根据的忧虑。","source":"《列子·天瑞》","example":"你这么担心未来的事情，简直是杞人忧天。","tags":["哲理","贬义","心理"]},{"idiom":"愚公移山","pinyin":"yú gōng yí shān","meaning":"比喻坚持不懈地改造自然和坚定不移地进行斗争。","source":"《列子·汤问》","example":"我们要有愚公移山的精神，不怕困难。","tags":["褒义","毅力","寓言"]},{"idiom":"郑人买履","pinyin":"zhèng rén mǎi lǚ","meaning":"比喻只相信教条，不相信实际情况。","source":"《韩非子·外储说左上》","example":"做事情要根据实际情况，不能像郑人买履那样死板。","tags":["贬义","哲理","寓言"]},{"idiom":"买椟还珠","pinyin":"mǎi dú huán zhū","meaning":"比喻没有眼光，取舍不当。","source":"《韩非子·外储说左上》","example":"只看包装不看内容，岂不是买椟还珠？","tags":["贬义","哲理","寓言"]},{"idiom":"自相矛盾","pinyin":"zì xiāng máo dùn","meaning":"比喻自己说话做事前后抵触。","source":"《韩非子·难一》","example":"他的发言前后矛盾，让人无法相信。","tags":["贬义","哲理","寓言"]},{"idiom":"纸上谈兵","pinyin":"zhǐ shàng tán bīng","meaning":"比喻只凭书本知识空发议论，不解决实际问题。","source":"《史记·廉颇蔺相如列传》","example":"他只会纸上谈兵，实际动手能力很差。","tags":["贬义","军事","哲理"]},{"idiom":"卧薪尝胆","pinyin":"wò xīn cháng dǎn","meaning":"形容人刻苦自励，发奋图强。","source":"《史记·越王勾践世家》","example":"经过几年卧薪尝胆的努力，公司终于扭亏为盈。","tags":["褒义","毅力","历史"]},{"idiom":"三顾茅庐","pinyin":"sān gù máo lú","meaning":"比喻诚心诚意地一再邀请或拜访有才能的人。","source":"三国蜀·诸葛亮《出师表》","example":"为了请这位专家出山，公司领导三顾茅庐。","tags":["褒义","历史","人才"]},{"idiom":"完璧归赵","pinyin":"wán bì guī zhào","meaning":"比喻把原物完好地归还本人。","source":"《史记·廉颇蔺相如列传》","example":"你放心，借给你的书我一定完璧归赵。","tags":["褒义","历史","诚信"]},{"idiom":"负荆请罪","pinyin":"fù jīng qǐng zuì","meaning":"表示主动向人认错赔罪。","source":"《史记·廉颇蔺相如列传》","example":"他意识到自己的错误后，主动负荆请罪。","tags":["褒义","历史","品德"]},{"idiom":"四面楚歌","pinyin":"sì miàn chǔ gē","meaning":"比喻陷入四面受敌、孤立无援的境地。","source":"《史记·项羽本纪》","example":"公司面临四面楚歌的困境，必须尽快改革。","tags":["历史","困境","军事"]},{"idiom":"破釜沉舟","pinyin":"pò fǔ chén zhōu","meaning":"比喻下决心不顾一切地干到底。","source":"《史记·项羽本纪》","example":"这次创业我们决定破釜沉舟，全力以赴。","tags":["褒义","军事","决心"]},{"idiom":"项庄舞剑","pinyin":"xiàng zhuāng wǔ jiàn","meaning":"比喻说话和行动别有用心，暗中针对某人。","source":"《史记·项羽本纪》","example":"他说这番话是项庄舞剑，意在沛公。","tags":["历史","贬义","比喻"]},{"idiom":"望梅止渴","pinyin":"wàng méi zhǐ kě","meaning":"比喻用空想来安慰自己。","source":"《世说新语·假谲》","example":"没有实际行动，光有计划只是望梅止渴。","tags":["心理","比喻","三国"]},{"idiom":"草木皆兵","pinyin":"cǎo mù jiē bīng","meaning":"形容惊慌失措，疑神疑鬼。","source":"《晋书·苻坚载记》","example":"他最近草木皆兵，总觉得有人在跟踪他。","tags":["心理","军事","贬义"]},{"idiom":"闻鸡起舞","pinyin":"wén jī qǐ wǔ","meaning":"比喻有志者及时奋发努力。","source":"《晋书·祖逖传》","example":"他每天闻鸡起舞，刻苦训练。","tags":["褒义","动物","毅力"]},{"idiom":"入木三分","pinyin":"rù mù sān fēn","meaning":"形容书法笔力刚劲有力，也比喻对文章或事物见解深刻。","source":"唐·张怀瓘《书断》","example":"他对时事的分析入木三分，令人佩服。","tags":["褒义","文学","书法"]},{"idiom":"胸有成竹","pinyin":"xiōng yǒu chéng zhú","meaning":"比喻做事前已有了通盘的考虑和打算。","source":"宋·苏轼《文与可画筼筜谷偃竹记》","example":"他看起来胸有成竹，应该已经做好了充分准备。","tags":["褒义","心理","自信"]},{"idiom":"百折不挠","pinyin":"bǎi zhé bù náo","meaning":"比喻意志坚强，面对挫折不退缩。","source":"汉·蔡邕《太尉乔玄碑》","example":"他以百折不挠的精神完成了这项艰巨的任务。","tags":["褒义","毅力","品质"]},{"idiom":"居安思危","pinyin":"jū ān sī wēi","meaning":"处在安逸的环境里，要考虑到可能会有危险出现。","source":"《左传·襄公十一年》","example":"企业要居安思危，时刻保持危机意识。","tags":["哲理","智慧","警示"]},{"idiom":"实事求是","pinyin":"shí shì qiú shì","meaning":"从实际情况出发，不夸大不缩小，正确对待和处理问题。","source":"《汉书·河间献王传》","example":"做研究必须实事求是，不能弄虚作假。","tags":["褒义","态度","科学"]},{"idiom":"脚踏实地","pinyin":"jiǎo tà shí dì","meaning":"比喻做事踏实认真，不浮夸。","source":"宋·邵雍《皇极经世书》","example":"他做事脚踏实地，一步一个脚印。","tags":["褒义","态度","品质"]},{"idiom":"塞翁失马","pinyin":"sài wēng shī mǎ","meaning":"比喻坏事在一定条件下可变为好事。","source":"《淮南子·人间训》","example":"这次失败也许是塞翁失马，焉知非福。","tags":["哲理","动物","寓言"]},{"idiom":"邯郸学步","pinyin":"hán dān xué bù","meaning":"比喻一味模仿别人，不仅没学到本事，反而连原来的本事也丢了。","source":"《庄子·秋水》","example":"学习别人的经验要结合自身实际，不能邯郸学步。","tags":["贬义","哲理","寓言"]},{"idiom":"锲而不舍","pinyin":"qiè ér bù shě","meaning":"比喻坚持不懈，持之以恒。","source":"《荀子·劝学》","example":"做科研需要锲而不舍的精神。","tags":["褒义","毅力","品质"]},{"idiom":"水滴石穿","pinyin":"shuǐ dī shí chuān","meaning":"比喻力量虽小，只要坚持不懈，就能成功。","source":"《汉书·枚乘传》","example":"学习需要水滴石穿的毅力。","tags":["褒义","毅力","哲理"]},{"idiom":"集思广益","pinyin":"jí sī guǎng yì","meaning":"集中群众的智慧，广泛吸收有益的意见。","source":"三国蜀·诸葛亮《教与军师长史参军掾属》","example":"做决策时要集思广益，听取各方意见。","tags":["褒义","智慧","合作"]},{"idiom":"乐不思蜀","pinyin":"lè bù sī shǔ","meaning":"比喻在新环境中得到乐趣，不再想回到原来的环境。","source":"《三国志·蜀书·后主传》","example":"他在度假胜地玩得乐不思蜀。","tags":["中性","历史","情绪"]},{"idiom":"同甘共苦","pinyin":"tóng gān gòng kǔ","meaning":"共同享受幸福，共同担当艰苦。","source":"《战国策·燕策一》","example":"他们夫妻俩同甘共苦，走过了大半辈子。","tags":["褒义","关系","品质"]},{"idiom":"一帆风顺","pinyin":"yī fān fēng shùn","meaning":"比喻非常顺利，没有阻碍。","source":"唐·孟郊《送郑仆射出节山南》","example":"祝你事业一帆风顺！","tags":["褒义","祝贺","顺利"]},{"idiom":"不耻下问","pinyin":"bù chǐ xià wèn","meaning":"比喻谦虚好学，不介意向地位或学识不如自己的人请教。","source":"《论语·公冶长》","example":"他虽然是资深专家，但仍然不耻下问。","tags":["褒义","好学","品德"]},{"idiom":"举一反三","pinyin":"jǔ yī fǎn sān","meaning":"比喻从一件事情类推而知道其他许多事情。","source":"《论语·述而》","example":"这位老师善于引导学生举一反三，触类旁通。","tags":["褒义","学习","能力"]},{"idiom":"温故知新","pinyin":"wēn gù zhī xīn","meaning":"温习旧知识，从中获得新的理解和体会。","source":"《论语·为政》","example":"学习要温故知新，不断巩固已学知识。","tags":["褒义","学习","教育"]},{"idiom":"千里之行，始于足下","pinyin":"qiān lǐ zhī xíng, shǐ yú zú xià","meaning":"比喻事情是从头做起，从点滴做起，逐步进行的。","source":"《老子》","example":"不要好高骛远，千里之行，始于足下。","tags":["哲理","起步","智慧"]},{"idiom":"百闻不如一见","pinyin":"bǎi wén bù rú yī jiàn","meaning":"听到一百次不如亲眼看到一次，指亲眼看到比听说更可靠。","source":"《荀子·儒效》","example":"都说这景点美，百闻不如一见，果然名不虚传。","tags":["哲理","经验","谚语"]},{"idiom":"半途而废","pinyin":"bàn tú ér fèi","meaning":"做事中途停止，未能坚持到底。","source":"《礼记·中庸》","example":"学习任何技能都不能半途而废。","tags":["贬义","毅力","警示"]},{"idiom":"杯水车薪","pinyin":"bēi shuǐ chē xīn","meaning":"比喻力量太小，解决不了问题。","source":"《孟子·告子上》","example":"这点捐款对于灾区的需求只是杯水车薪。","tags":["比喻","哲理","生活"]},{"idiom":"闭门造车","pinyin":"bì mén zào chē","meaning":"比喻不切实际，只凭主观想象办事。","source":"宋·朱熹《中庸或问》","example":"做产品不能闭门造车，要多听听用户的声音。","tags":["贬义","工作","态度"]},{"idiom":"鞭长莫及","pinyin":"biān cháng mò jí","meaning":"比喻力量达不到。","source":"《左传·宣公十五年》","example":"总部的管理对海外分公司鞭长莫及。","tags":["比喻","管理","距离"]},{"idiom":"宾至如归","pinyin":"bīn zhì rú guī","meaning":"客人到这里就像回到自己家里一样，形容待客热情周到。","source":"《左传·襄公三十一年》","example":"这家酒店服务周到，让人有宾至如归的感觉。","tags":["褒义","服务","生活"]},{"idiom":"不寒而栗","pinyin":"bù hán ér lì","meaning":"不冷而发抖，形容非常恐惧。","source":"《史记·酷吏列传》","example":"那部恐怖片看得我不寒而栗。","tags":["心理","情绪","描写"]},{"idiom":"不劳而获","pinyin":"bù láo ér huò","meaning":"不劳动而得到收获，比喻不付出努力就获取成果。","source":"《孔子家语·入官》","example":"他整天想着不劳而获，最终一事无成。","tags":["贬义","劳动","生活"]},{"idiom":"不谋而合","pinyin":"bù móu ér hé","meaning":"没有事先商量而彼此见解或行动完全一致。","source":"晋·干宝《搜神记》","example":"我们的想法不谋而合，真是太巧了。","tags":["褒义","思维","一致"]},{"idiom":"不可思议","pinyin":"bù kě sī yì","meaning":"无法想象，难以理解。","source":"北魏·杨衒之《洛阳伽蓝记》","example":"他竟然在短短一年内学会了三门语言，真是不可思议。","tags":["中性","评价","表达"]},{"idiom":"不求甚解","pinyin":"bù qiú shèn jiě","meaning":"读书只求懂得大意，不求深刻理解。","source":"晋·陶潜《五柳先生传》","example":"读书要深入思考，不能不求甚解。","tags":["贬义","学习","态度"]},{"idiom":"不屈不挠","pinyin":"bù qū bù náo","meaning":"形容在困难面前不屈服，不退缩。","source":"《汉书·叙传下》","example":"他以不屈不挠的精神克服了重重困难。","tags":["褒义","毅力","品质"]},{"idiom":"不速之客","pinyin":"bù sù zhī kè","meaning":"没有邀请而自己来的客人。","source":"《周易·需卦》","example":"昨晚家里来了一位不速之客。","tags":["中性","生活","人物"]},{"idiom":"不言而喻","pinyin":"bù yán ér yù","meaning":"不用说就能明白，形容道理很明显。","source":"《孟子·尽心上》","example":"努力的重要性不言而喻。","tags":["中性","表达","哲理"]},{"idiom":"不翼而飞","pinyin":"bù yì ér fēi","meaning":"没有翅膀却飞走了，比喻东西突然丢失或消息迅速传播。","source":"《战国策·齐策六》","example":"我刚放桌上的钥匙不翼而飞了。","tags":["中性","比喻","生活"]},{"idiom":"不由自主","pinyin":"bù yóu zì zhǔ","meaning":"由不得自己做主，形容无法控制自己。","source":"清·曹雪芹《红楼梦》","example":"听到这个消息，他不由自主地站了起来。","tags":["中性","心理","情绪"]},{"idiom":"层出不穷","pinyin":"céng chū bù qióng","meaning":"接连不断地出现，没有穷尽。","source":"唐·韩愈《贞曜先生墓志铭》","example":"科技发展日新月异，新产品层出不穷。","tags":["中性","变化","发展"]},{"idiom":"差强人意","pinyin":"chā qiáng rén yì","meaning":"大体上还能让人满意。","source":"《后汉书·吴汉传》","example":"虽然有些小瑕疵，但整体表现还算差强人意。","tags":["中性","评价","感受"]},{"idiom":"陈词滥调","pinyin":"chén cí làn diào","meaning":"陈旧而不切实际的话。","source":"《史记·平津侯主父列传》","example":"他的演讲都是些陈词滥调，毫无新意。","tags":["贬义","表达","写作"]},{"idiom":"乘风破浪","pinyin":"chéng fēng pò làng","meaning":"比喻不畏艰险，奋勇前进。","source":"《宋书·宗悫传》","example":"祝你们在创业路上乘风破浪，勇往直前。","tags":["褒义","励志","行动"]},{"idiom":"出类拔萃","pinyin":"chū lèi bá cuì","meaning":"超出同类之上。","source":"《孟子·公孙丑上》","example":"她在同龄人中出类拔萃，才华横溢。","tags":["褒义","才能","评价"]},{"idiom":"触类旁通","pinyin":"chù lèi páng tōng","meaning":"掌握了某一事物的知识或规律，就能类推了解同类的其他事物。","source":"《周易·系辞上》","example":"学习要善于触类旁通，举一反三。","tags":["褒义","学习","能力"]},{"idiom":"唇亡齿寒","pinyin":"chún wáng chǐ hán","meaning":"比喻双方关系密切，相互依存。","source":"《左传·僖公五年》","example":"两公司是唇亡齿寒的关系，一损俱损。","tags":["比喻","关系","哲理"]},{"idiom":"从容不迫","pinyin":"cóng róng bù pò","meaning":"不慌不忙，沉着镇定。","source":"《庄子·秋水》","example":"面对突发状况，他从容不迫地处理。","tags":["褒义","态度","品质"]},{"idiom":"大材小用","pinyin":"dà cái xiǎo yòng","meaning":"把大的材料用在小处，比喻人才使用不当。","source":"晋·石崇《许巢论》","example":"让博士去做简单的数据录入，未免大材小用。","tags":["贬义","人才","管理"]},{"idiom":"大刀阔斧","pinyin":"dà dāo kuò fǔ","meaning":"比喻办事果断而有魄力。","source":"《水浒传》","example":"新上任的经理大刀阔斧地进行改革。","tags":["褒义","行动","管理"]},{"idiom":"大功告成","pinyin":"dà gōng gào chéng","meaning":"巨大的工程或重要的任务宣告完成。","source":"《后汉书·光武帝纪上》","example":"经过三年的努力，这个项目终于大功告成。","tags":["褒义","成功","事件"]},{"idiom":"大惊小怪","pinyin":"dà jīng xiǎo guài","meaning":"形容对不足为奇的事情过分惊讶。","source":"宋·朱熹《答林择之》","example":"不过是打碎了一个杯子，不必大惊小怪。","tags":["贬义","情绪","反应"]},{"idiom":"大器晚成","pinyin":"dà qì wǎn chéng","meaning":"比喻有大才的人成就较晚。","source":"《老子》","example":"他三十岁才找到人生方向，真可谓大器晚成。","tags":["褒义","人才","哲理"]},{"idiom":"大势所趋","pinyin":"dà shì suǒ qū","meaning":"整个局势发展的趋向。","source":"宋·陈亮《上孝宗皇帝第三书》","example":"数字化转型是大势所趋。","tags":["中性","趋势","社会"]},{"idiom":"大同小异","pinyin":"dà tóng xiǎo yì","meaning":"大部分相同，只有小部分不同。","source":"《庄子·天下》","example":"这两款手机大同小异，价格却差了很多。","tags":["中性","比较","评价"]},{"idiom":"当务之急","pinyin":"dāng wù zhī jí","meaning":"当前事务中最急切要办的事。","source":"《孟子·尽心上》","example":"当务之急是解决资金问题。","tags":["中性","事务","管理"]},{"idiom":"得意忘形","pinyin":"dé yì wàng xíng","meaning":"形容高兴得失去了常态。","source":"《晋书·阮籍传》","example":"取得一点成绩就得意忘形，这是不成熟的表现。","tags":["贬义","情绪","行为"]},{"idiom":"独当一面","pinyin":"dú dāng yī miàn","meaning":"单独担当一个方面的任务。","source":"《史记·留侯世家》","example":"他已经成长为一个能独当一面的项目经理。","tags":["褒义","能力","工作"]},{"idiom":"咄咄逼人","pinyin":"duō duō bī rén","meaning":"形容气势汹汹，盛气凌人。","source":"晋·卫铄《与释某书》","example":"他说话的语气咄咄逼人，让人很不舒服。","tags":["贬义","态度","沟通"]},{"idiom":"耳濡目染","pinyin":"ěr rú mù rǎn","meaning":"耳朵经常听到，眼睛经常看到，不知不觉地受到影响。","source":"唐·韩愈《清河郡公房公墓碣铭》","example":"在书香门第长大，耳濡目染之下他也爱上了阅读。","tags":["中性","学习","环境"]},{"idiom":"耳目一新","pinyin":"ěr mù yī xīn","meaning":"听到的、看到的跟以前完全不同，令人感到新鲜。","source":"《魏书·元澄传》","example":"新的设计风格让人耳目一新。","tags":["褒义","感受","变化"]},{"idiom":"发扬光大","pinyin":"fā yáng guāng dà","meaning":"使美好的事物更加发展、盛大。","source":"宋·黄榦《答张敬夫书》","example":"我们要把传统文化发扬光大。","tags":["褒义","文化","行动"]},{"idiom":"翻天覆地","pinyin":"fān tiān fù dì","meaning":"形容变化巨大而彻底。","source":"唐·刘商《胡笳十八拍》","example":"这些年家乡发生了翻天覆地的变化。","tags":["中性","变化","形容"]},{"idiom":"防微杜渐","pinyin":"fáng wēi dù jiàn","meaning":"在错误或坏事刚露头时就加以制止。","source":"《后汉书·丁鸿传》","example":"安全问题要防微杜渐，不可掉以轻心。","tags":["褒义","管理","警示"]},{"idiom":"废寝忘食","pinyin":"fèi qǐn wàng shí","meaning":"顾不得睡觉，忘记了吃饭，形容专心努力。","source":"《列子·天瑞》","example":"他为了完成项目废寝忘食地工作。","tags":["褒义","工作","态度"]},{"idiom":"奋发图强","pinyin":"fèn fā tú qiáng","meaning":"振作精神，努力自强。","source":"《论语·子罕》","example":"全国人民奋发图强，建设美好家园。","tags":["褒义","励志","行动"]},{"idiom":"风餐露宿","pinyin":"fēng cān lù sù","meaning":"在风里吃饭，在露天睡觉，形容旅途或野外生活的艰苦。","source":"宋·苏轼《将至筠先寄迟适远三犹子》","example":"地质勘探队员风餐露宿，十分辛苦。","tags":["中性","生活","艰苦"]},{"idiom":"风吹草动","pinyin":"fēng chuī cǎo dòng","meaning":"风稍一吹，草就摇晃，比喻轻微的动静或变化。","source":"《敦煌变文集·伍子胥变文》","example":"一有风吹草动他就紧张得不得了。","tags":["中性","比喻","变化"]},{"idiom":"风雨同舟","pinyin":"fēng yǔ tóng zhōu","meaning":"比喻共同经历困难，同甘共苦。","source":"《孙子·九地》","example":"多年来我们风雨同舟，建立了深厚的友谊。","tags":["褒义","关系","合作"]},{"idiom":"釜底抽薪","pinyin":"fǔ dǐ chōu xīn","meaning":"从锅底抽掉柴火，比喻从根本上解决问题。","source":"《吕氏春秋·尽数》","example":"与其扬汤止沸，不如釜底抽薪。","tags":["褒义","方法","智慧"]},{"idiom":"赴汤蹈火","pinyin":"fù tāng dǎo huǒ","meaning":"比喻不避艰险，奋勇向前。","source":"《荀子·议兵》","example":"为了正义的事业，他赴汤蹈火在所不辞。","tags":["褒义","勇气","行动"]},{"idiom":"覆水难收","pinyin":"fù shuǐ nán shōu","meaning":"倒在地上的水难以收回，比喻事情已成定局，无法挽回。","source":"《后汉书·何进传》","example":"既然已经做了决定，覆水难收，只能向前看。","tags":["哲理","警示","比喻"]},{"idiom":"刚愎自用","pinyin":"gāng bì zì yòng","meaning":"固执己见，不接受别人的意见。","source":"《左传·宣公十二年》","example":"领导者如果刚愎自用，很难带领团队成功。","tags":["贬义","性格","管理"]},{"idiom":"高枕无忧","pinyin":"gāo zhěn wú yōu","meaning":"垫高枕头安心睡觉，形容平安无事，不需担忧。","source":"《战国策·齐策四》","example":"虽然取得了阶段性成果，但还不能高枕无忧。","tags":["中性","状态","警示"]},{"idiom":"功亏一篑","pinyin":"gōng kuī yī kuì","meaning":"堆九仞高的土山，只差一筐土没有完成，比喻做事只差最后一步而未能完成。","source":"《尚书·旅獒》","example":"实验接近成功时却因一个小失误功亏一篑。","tags":["贬义","做事","警示"]},{"idiom":"勾心斗角","pinyin":"gōu xīn dòu jiǎo","meaning":"比喻各用心机，互相排挤。","source":"唐·杜牧《阿房宫赋》","example":"公司内部勾心斗角，严重影响团队效率。","tags":["贬义","关系","职场"]},{"idiom":"孤注一掷","pinyin":"gū zhù yī zhì","meaning":"把所有的钱一次押上去，比喻在危急时用尽所有力量作最后一次冒险。","source":"《宋史·寇准传》","example":"他把全部积蓄孤注一掷地投入了创业。","tags":["中性","风险","行动"]},{"idiom":"顾全大局","pinyin":"gù quán dà jú","meaning":"一切从整体利益出发，不使受到损害。","source":"清·吴趼人《二十年目睹之怪现状》","example":"虽然个人有损失，但要顾全大局。","tags":["褒义","品德","管理"]},{"idiom":"顾名思义","pinyin":"gù míng sī yì","meaning":"看到名称就联想到它的含义。","source":"《三国志·魏书·王昶传》","example":"区块链，顾名思义，就是由区块组成的链。","tags":["中性","逻辑","表达"]},{"idiom":"过河拆桥","pinyin":"guò hé chāi qiáo","meaning":"自己过了河就把桥拆掉，比喻达到目的后就把帮助过自己的人一脚踢开。","source":"《元史·彻里帖木儿传》","example":"他利用完别人就过河拆桥，人品很差。","tags":["贬义","品德","关系"]},{"idiom":"过犹不及","pinyin":"guò yóu bù jí","meaning":"事情办得过火，就跟做得不够一样，都是不好的。","source":"《论语·先进》","example":"锻炼身体也要适度，过犹不及。","tags":["哲理","警示","中庸"]},{"idiom":"害群之马","pinyin":"hài qún zhī mǎ","meaning":"比喻危害集体的人。","source":"《庄子·徐无鬼》","example":"少数害群之马影响了整个团队的声誉。","tags":["贬义","人物","管理"]},{"idiom":"含沙射影","pinyin":"hán shā shè yǐng","meaning":"比喻暗中攻击或陷害人。","source":"晋·干宝《搜神记》","example":"他说话含沙射影，让人很不舒服。","tags":["贬义","行为","沟通"]},{"idiom":"好高骛远","pinyin":"hào gāo wù yuǎn","meaning":"不切实际地追求过高过远的目标。","source":"《宋史·程颢传》","example":"学习要脚踏实地，不能好高骛远。","tags":["贬义","态度","警示"]},{"idiom":"合情合理","pinyin":"hé qíng hé lǐ","meaning":"合乎情理。","source":"清·吴趼人《二十年目睹之怪现状》","example":"这个要求合情合理，我们应当满足。","tags":["褒义","逻辑","评价"]},{"idiom":"后来居上","pinyin":"hòu lái jū shàng","meaning":"后来的超过先前的。","source":"《史记·汲郑列传》","example":"这家新兴企业后来居上，成为行业领头羊。","tags":["褒义","发展","竞争"]},{"idiom":"春暖花开","pinyin":"chun nuan hua kai","meaning":"春天气候温暖，百花盛开，形容春天的美好景象。","source":"明·朱国祯《涌幢小品》","example":"春暖花开的季节，最适合外出踏青。","tags":["自然","褒义","季节"],"story":"明代文人朱国祯在《涌幢小品》中描绘春日景象：春风送暖，百花争艳，万物复苏，一派生机盎然的景象。","usage":"用于描写春天景色，或比喻形势好转、充满希望的时期。"},{"idiom":"风和日丽","pinyin":"feng he ri li","meaning":"微风和煦，阳光明丽，形容天气晴朗暖和。","source":"唐·李商隐《杂纂》","example":"今天风和日丽，我们去公园野餐吧。","tags":["自然","褒义","季节"],"story":"唐代诗人李商隐在《杂纂》中列出风和日丽作为好天气的典型特征，形容轻风柔和、阳光明媚的宜人天气。","usage":"常用于描写天气晴朗、景色宜人的场景。"},{"idiom":"冰天雪地","pinyin":"bing tian xue di","meaning":"形容冰雪漫天盖地，非常寒冷。","source":"清·蒋士铨《鸡毛房》","example":"东北的冬天冰天雪地，气温常降到零下三十度。","tags":["自然","中性","季节"],"story":"清代诗人蒋士铨在《鸡毛房》诗中描写贫民在冰天雪地的严冬中艰难求生的场景，用冰天雪地来形容北方的极度严寒。","usage":"用于描写极寒天气或冰雪覆盖的景象。"},{"idiom":"雨后春笋","pinyin":"yu hou chun sun","meaning":"春天下雨后竹笋长得又快又多，比喻新生事物大量涌现。","source":"宋·张耒《食笋》","example":"近年来，共享单车像雨后春笋般出现在各大城市。","tags":["自然","褒义","比喻"],"story":"宋代诗人张耒在诗中描写春雨过后竹笋纷纷破土而出的景象，后人用来比喻新生事物迅速大量地出现。","usage":"用于形容新事物、新企业等大量、快速地涌现。"},{"idiom":"山清水秀","pinyin":"shan qing shui xiu","meaning":"形容山水风景优美。","source":"宋·黄庭坚《蓦山溪》","example":"我的家乡山清水秀，是一个宜居的小城。","tags":["自然","褒义","景色"],"story":"黄庭坚在词中描绘山水相映成趣的美景：青山如黛，碧水如练，山水之间自有一种灵秀之气。","usage":"用于赞美某地自然环境优美。"},{"idiom":"鸟语花香","pinyin":"niao yu hua xiang","meaning":"鸟儿叫，花儿飘香，形容春天美好的景色。","source":"清·李渔《笠翁对韵》","example":"春天的公园鸟语花香，令人心旷神怡。","tags":["自然","褒义","动物"],"story":"李渔在《笠翁对韵》中以鸟语花香对风调雨顺，描绘了春日中鸟鸣花香的和谐自然景象。","usage":"用于描写春天或环境优美的场景。"},{"idiom":"月明星稀","pinyin":"yue ming xing xi","meaning":"月亮明亮时星星就显得稀疏了。","source":"三国魏·曹操《短歌行》","example":"月明星稀的夜晚，他独自在湖边散步。","tags":["自然","中性","景色"],"story":"曹操在《短歌行》中写道：月明星稀，乌鹊南飞。绕树三匝，何枝可依？借月明星稀的夜景抒发求贤若渴的心情。","usage":"用于描写晴朗的夜空景色。"},{"idiom":"云开雾散","pinyin":"yun kai wu san","meaning":"云雾消散，天气转晴，比喻原本模糊或压抑的局面变得明朗。","source":"宋·陆游《秋夜将晓出篱门迎凉有感》","example":"误会澄清后，两人之间的隔阂终于云开雾散。","tags":["自然","褒义","比喻"],"story":"陆游在诗中描写秋夜云开雾散后明月当空的景象，后引申为困扰或疑虑消除、局面变得清晰。","usage":"用于比喻误会消除、形势好转或心情由阴转晴。"},{"idiom":"风调雨顺","pinyin":"feng tiao yu shun","meaning":"风雨及时适量，利于农作物生长，形容年景好。","source":"《六韬》","example":"今年风调雨顺，粮食一定大丰收。","tags":["自然","褒义","农业"],"story":"《六韬》中记载：武王问太公怎样才能风调雨顺，太公回答要顺应天时、爱惜民力。后用来形容年景好、国泰民安。","usage":"用于祝福年景好、丰收，或形容条件顺利。"},{"idiom":"海阔天空","pinyin":"hai kuo tian kong","meaning":"像大海一样辽阔，像天空一样无边，形容无拘无束或心胸开阔。","source":"唐·刘氏《暗离别》","example":"两人聊得海阔天空，忘记了时间。","tags":["自然","褒义","比喻"],"story":"原指大自然的广阔无垠，唐代诗人在诗中用海阔天空来形容离别后天各一方的遥远距离，后引申为心胸开阔或谈话无拘无束。","usage":"用于形容畅谈无拘束，或形容心胸开阔、境界高远。"},{"idiom":"雪中送炭","pinyin":"xue zhong song tan","meaning":"在寒冷的雪天给人送炭取暖，比喻在别人急需时给予帮助。","source":"宋·范成大《大雪送炭与芥隐》","example":"在我最困难的时候，朋友雪中送炭，帮我渡过了难关。","tags":["自然","褒义","品德"],"story":"范成大在大雪天给朋友送炭，诗中写道：不是雪中须送炭，聊装风景要诗来。强调在别人最需要的时候伸出援手。","usage":"用于赞美在他人困难时提供及时帮助的行为。"},{"idiom":"锦上添花","pinyin":"jin shang tian hua","meaning":"在锦缎上再绣花，比喻好上加好，美上添美。","source":"宋·黄庭坚《了了庵颂》","example":"公司业绩已经很好了，这次获奖更是锦上添花。","tags":["自然","褒义","比喻"],"story":"黄庭坚在《了了庵颂》中写道：又要涪翁作颂，且图锦上添花。原指在精美的锦缎上再刺绣添花，使美的更加美。","usage":"用于形容在已有的好基础上再增添更好的东西。"},{"idiom":"花好月圆","pinyin":"hua hao yue yuan","meaning":"花儿正盛开，月亮正圆满，比喻美好圆满。","source":"宋·晁端礼《行香子》","example":"祝你们新婚快乐，花好月圆！","tags":["自然","褒义","祝福"],"story":"晁端礼在词中写道：花好月圆，人生如意。以花和月的美好象征人生的幸福圆满，后成为婚礼常用的祝福语。","usage":"多用于祝福新婚夫妇幸福美满。"},{"idiom":"万紫千红","pinyin":"wan zi qian hong","meaning":"形容百花齐放、色彩艳丽，也比喻事物丰富多彩。","source":"宋·朱熹《春日》","example":"春天的花园万紫千红，美不胜收。","tags":["自然","褒义","颜色"],"story":"朱熹在《春日》诗中写道：等闲识得东风面，万紫千红总是春。用万紫千红来形容春天百花盛开的绚烂景象。","usage":"用于描写春天的繁花似锦，或形容事物丰富多彩。"},{"idiom":"郁郁葱葱","pinyin":"yu yu cong cong","meaning":"形容草木苍翠茂盛，也形容气象旺盛美好。","source":"《后汉书·光武帝纪》","example":"这片森林郁郁葱葱，充满了生机。","tags":["自然","褒义","景色"],"story":"《后汉书》记载望气者苏伯阿遥望舂陵城说：气佳哉，郁郁葱葱。形容草木茂盛、气象非凡。","usage":"用于描写草木茂盛或气象旺盛的景象。"},{"idiom":"惊涛骇浪","pinyin":"jing tao hai lang","meaning":"凶猛而使人害怕的波涛，比喻险恶的环境或尖锐的斗争。","source":"唐·李华《吊古战场文》","example":"人生就像航行，难免会遇到惊涛骇浪。","tags":["自然","中性","比喻"],"story":"李华在《吊古战场文》中用惊涛骇浪来描写战场的凶险，后多比喻人生或事业中遇到的巨大困难和挑战。","usage":"用于形容巨大的风浪，或比喻艰难险阻的环境。"},{"idiom":"崇山峻岭","pinyin":"chong shan jun ling","meaning":"高大陡峭的山岭。","source":"晋·王羲之《兰亭集序》","example":"这一带崇山峻岭，道路十分艰险。","tags":["自然","中性","景色"],"story":"王羲之在《兰亭集序》中写道：此地有崇山峻岭，茂林修竹。描绘了兰亭周围壮丽秀美的自然风光。","usage":"用于描写高大险峻的山脉地形。"},{"idiom":"浩浩荡荡","pinyin":"hao hao dang dang","meaning":"原指水势广大，后形容规模宏大、气势雄壮。","source":"《尚书·尧典》","example":"游行队伍浩浩荡荡地通过广场。","tags":["自然","中性","形容"],"story":"《尚书·尧典》中写道：汤汤洪水方割，荡荡怀山襄陵，浩浩滔天。形容洪水奔流盛大、气势磅礴的景象。","usage":"用于形容人群、队伍、水流等规模宏大、气势壮阔。"},{"idiom":"一心一意","pinyin":"yi xin yi yi","meaning":"心思专一，没有杂念。","source":"《三国志·魏书·杜恕传》","example":"他做任何事情都一心一意，从不三心二意。","tags":["数字","褒义","态度"],"story":"杜恕在上疏中劝谏魏明帝要一心一意治理国家，不被佞臣迷惑。强调专一不二的重要性。","usage":"用于形容专注于某事、心无旁骛的态度。"},{"idiom":"三心二意","pinyin":"san xin er yi","meaning":"又想这样又想那样，犹豫不决，意志不坚定。","source":"元·关汉卿《救风尘》","example":"既然选择了这条路，就不要三心二意。","tags":["数字","贬义","态度"],"story":"关汉卿在《救风尘》中写道：休想我三心二意。形容人拿不定主意，反复无常。","usage":"用于批评意志不坚定、做事犹豫不决的人。"},{"idiom":"四面八方","pinyin":"si mian ba fang","meaning":"各个方向，各处。","source":"宋·释道元《景德传灯录》","example":"游客从四面八方涌来参加这场盛会。","tags":["数字","中性","方位"],"story":"《景德传灯录》中记载禅师用四面八方来形容无处不在的佛法，后泛指各个方向和各个地方。","usage":"用于形容来自各个地方或各个方向。"},{"idiom":"五颜六色","pinyin":"wu yan liu se","meaning":"形容色彩繁多。","source":"清·李汝珍《镜花缘》","example":"广场上挂满了五颜六色的气球。","tags":["数字","中性","颜色"],"story":"《镜花缘》中描写各国来朝的盛况，礼物五颜六色、琳琅满目，形容色彩丰富、种类繁多。","usage":"用于描写色彩缤纷的景象。"},{"idiom":"六神无主","pinyin":"liu shen wu zhu","meaning":"形容惊慌失措或因担心而心神不定。","source":"明·冯梦龙《醒世恒言》","example":"听到这个噩耗，她吓得六神无主。","tags":["数字","贬义","心理"],"story":"古人认为心、肺、肝、肾、脾、胆各有神灵主宰，六神无主指失去主宰，形容极度惊慌或焦虑的状态。","usage":"用于形容人因惊吓或担忧而心神不定的样子。"},{"idiom":"七嘴八舌","pinyin":"qi zui ba she","meaning":"形容人多口杂，议论纷纷。","source":"明·冯梦龙《喻世明言》","example":"大家七嘴八舌地讨论着，谁也说服不了谁。","tags":["数字","中性","形容"],"story":"《喻世明言》中描写众人议论纷纷的场景：大家七嘴八舌，各说各的理，场面十分热闹。","usage":"用于形容多人同时发言、议论纷纷的场景。"},{"idiom":"九牛一毛","pinyin":"jiu niu yi mao","meaning":"九头牛身上的一根毛，比喻极小或微不足道。","source":"汉·司马迁《报任安书》","example":"这点损失对他来说不过是九牛一毛。","tags":["数字","比喻","动物"],"story":"司马迁在《报任安书》中写道：假令仆伏法受诛，若九牛亡一毛，与蝼蚁何以异？形容自己的死微不足道。","usage":"用于形容数量极少或价值微不足道。"},{"idiom":"十全十美","pinyin":"shi quan shi mei","meaning":"各方面都非常完美，毫无缺陷。","source":"《周礼·天官》","example":"世界上没有十全十美的人。","tags":["数字","褒义","评价"],"story":"《周礼》中有十全为上的说法，原指医术高明，后泛指各方面都达到完美的境界。","usage":"用于形容事物完美无缺，常用于否定句表示没有绝对完美。"},{"idiom":"百发百中","pinyin":"bai fa bai zhong","meaning":"每次射击都命中目标，比喻做事有充分把握。","source":"《战国策·西周策》","example":"他射箭技术高超，百发百中。","tags":["数字","褒义","能力"],"story":"楚国养由基善于射箭，能在百步之外射中杨柳叶子，百发百中。后人用来形容做事准确、有绝对把握。","usage":"用于形容射击准确或做事有充分把握。"},{"idiom":"千军万马","pinyin":"qian jun wan ma","meaning":"形容雄壮的队伍或浩大的声势。","source":"《梁书·陈庆之传》","example":"即使面对千军万马，他也毫不畏惧。","tags":["数字","中性","军事"],"story":"《梁书》记载陈庆之以数千兵力击败北魏数十万大军，被赞为有千军万马之势。形容军队声势浩大。","usage":"用于形容军队众多、气势磅礴的场面。"},{"idiom":"万马奔腾","pinyin":"wan ma ben teng","meaning":"成千上万匹马奔跑腾跃，形容声势浩大或场面壮观。","source":"明·凌濛初《初刻拍案惊奇》","example":"瀑布倾泻而下，声如万马奔腾。","tags":["数字","中性","自然"],"story":"《初刻拍案惊奇》中描写水势浩大，如万马奔腾般汹涌澎湃，形容气势磅礴、不可阻挡。","usage":"用于形容水流、声音、气势等浩大壮观的场面。"},{"idiom":"独一无二","pinyin":"du yi wu er","meaning":"只有这一个，没有第二个，形容唯一的、没有可比的。","source":"宋·延寿《宗镜录》","example":"这件艺术品在全世界独一无二，价值连城。","tags":["数字","褒义","评价"],"story":"《宗镜录》中讲佛法至高无上、独一无二，世间无有与其相等者。后指唯一、不可替代的事物。","usage":"用于强调事物的唯一性和不可替代性。"},{"idiom":"成千上万","pinyin":"cheng qian shang wan","meaning":"形容数量非常多。","source":"清·文康《儿女英雄传》","example":"成千上万的市民涌上街头庆祝胜利。","tags":["数字","中性","数量"],"story":"《儿女英雄传》中描写人群如潮水般涌来，成千上万形容人数众多、不可计数。","usage":"用于形容数量极其庞大。"},{"idiom":"三令五申","pinyin":"san ling wu shen","meaning":"多次命令和告诫。","source":"《史记·孙子吴起列传》","example":"学校已经三令五申禁止考试作弊。","tags":["数字","中性","管理"],"story":"孙武以兵法训练宫女，三令五申纪律后仍有人不听，于是斩了吴王的两个爱妃以正军纪。后指反复强调命令。","usage":"用于强调多次发布命令或反复提醒告诫。"},{"idiom":"灯红酒绿","pinyin":"deng hong jiu lv","meaning":"形容寻欢作乐的腐化生活，也形容都市或娱乐场所夜晚的繁华景象。","source":"清·吴趼人《二十年目睹之怪现状》","example":"大城市里灯红酒绿的生活让很多人迷失了方向。","tags":["颜色","贬义","社会"],"story":"《二十年目睹之怪现状》中描写上海夜生活的奢靡场景，红灯绿酒间人们沉醉于享乐。","usage":"用于形容繁华奢靡的夜生活，含贬义。"},{"idiom":"青出于蓝","pinyin":"qing chu yu lan","meaning":"青色从蓼蓝中提取出来却比蓼蓝更青，比喻学生超过老师或后人胜过前人。","source":"《荀子·劝学》","example":"这位年轻科学家的成就青出于蓝而胜于蓝。","tags":["颜色","褒义","学习"],"story":"荀子在《劝学》中说：青，取之于蓝而青于蓝；冰，水为之而寒于水。用染色和制冰比喻学习可以超越前人。","usage":"用于赞美学生或后辈超越了老师或前辈。"},{"idiom":"姹紫嫣红","pinyin":"cha zi yan hong","meaning":"形容各种花朵娇艳美丽。","source":"明·汤显祖《牡丹亭》","example":"花园里姹紫嫣红，一片春天的景象。","tags":["颜色","褒义","自然"],"story":"汤显祖在《牡丹亭》中写道：原来姹紫嫣红开遍，似这般都付与断井颓垣。描写花园中百花盛开的绚烂。","usage":"用于描写春天花朵盛开的艳丽景象。"},{"idiom":"红花绿叶","pinyin":"hong hua lv ye","meaning":"红色的花配绿色的叶子，形容色彩鲜明，也比喻相互衬托。","source":"宋·朱熹《春日》","example":"这幅画红花绿叶，相得益彰。","tags":["颜色","褒义","自然"],"story":"古语有红花虽好还需绿叶扶持，强调红花与绿叶的相互衬托关系，比喻主次配合、相得益彰。","usage":"用于形容色彩搭配和谐，或比喻相互配合、衬托的关系。"},{"idiom":"漆黑一团","pinyin":"qi hei yi tuan","meaning":"形容非常黑暗，没有一点光明，也形容一无所知。","source":"清·吴趼人《二十年目睹之怪现状》","example":"停电后屋里漆黑一团，伸手不见五指。","tags":["颜色","中性","形容"],"story":"形容极度黑暗的状态，伸手不见五指，也用于比喻对某件事情完全不了解或形势一片黑暗。","usage":"用于形容光线极暗或比喻对情况完全不了解。"},{"idiom":"面红耳赤","pinyin":"mian hong er chi","meaning":"脸和耳朵都红了，形容因激动、羞愧、发怒或用力而脸色涨红。","source":"明·吴承恩《西游记》","example":"两人争论得面红耳赤，谁也不肯让步。","tags":["颜色","中性","情绪"],"story":"《西游记》中描写孙悟空与人争辩时面红耳赤的样子，用来形容情绪激动时面部充血的状态。","usage":"用于形容因争论、害羞、愤怒或用力而脸红的模样。"},{"idiom":"白纸黑字","pinyin":"bai zhi hei zi","meaning":"白纸上写着黑字，比喻有确凿的文字证据，不容抵赖。","source":"元·无名氏《看钱奴》","example":"合同上白纸黑字写得清清楚楚，不能反悔。","tags":["颜色","中性","法律"],"story":"元代杂剧中常用白纸黑字来形容契约、文书等书面证据的不可抵赖性，强调文字记载的效力。","usage":"用于强调有书面证据、事实确凿。"},{"idiom":"五彩缤纷","pinyin":"wu cai bin fen","meaning":"色彩繁多而艳丽。","source":"清·吴趼人《二十年目睹之怪现状》","example":"广场上五彩缤纷的礼花照亮了夜空。","tags":["颜色","褒义","形容"],"story":"《二十年目睹之怪现状》中描写了五彩缤纷的灯会景象，形容色彩丰富、华丽夺目。","usage":"用于描写色彩丰富、绚丽的景象。"},{"idiom":"花红柳绿","pinyin":"hua hong liu lv","meaning":"花儿红、柳树绿，形容春天明媚的景象。","source":"唐·杜甫《奉酬李都督表丈早春作》","example":"春天的西湖花红柳绿，游人如织。","tags":["颜色","褒义","季节"],"story":"杜甫在诗中描绘早春时节花红柳绿的明媚景色，后成为描写春色的经典用语。","usage":"用于描写春天花草树木色彩鲜明的景色。"},{"idiom":"橙黄橘绿","pinyin":"cheng huang ju lv","meaning":"橙子黄了、橘子还绿，形容秋天丰收的景象。","source":"宋·苏轼《赠刘景文》","example":"秋天是橙黄橘绿的丰收季节。","tags":["颜色","褒义","季节"],"story":"苏轼在诗中写道：一年好景君须记，正是橙黄橘绿时。描写秋天果实成熟、色彩斑斓的丰收景象。","usage":"用于描写秋收时节硕果累累的景色。"},{"idiom":"青红皂白","pinyin":"qing hong zao bai","meaning":"比喻是非、情由等。","source":"元·无名氏《勘金环》","example":"他不问青红皂白就把人骂了一顿。","tags":["颜色","中性","比喻"],"story":"青红皂白原指四种颜色，后比喻事情的是非曲直。常与不分、不问连用，指不辨是非。","usage":"常用于不分青红皂白的固定搭配，指不辨是非曲直。"},{"idiom":"红白喜事","pinyin":"hong bai xi shi","meaning":"红指婚事，白指丧事，泛指婚丧之事。","source":"清·钱泳《履园丛话》","example":"村里谁家有红白喜事，大家都会去帮忙。","tags":["颜色","中性","社会"],"story":"中国传统中红色代表喜事（婚嫁），白色代表丧事。合称红白喜事，视生死为人生自然之事。","usage":"用于泛指婚丧嫁娶等人生大事。"},{"idiom":"见义勇为","pinyin":"jian yi yong wei","meaning":"看到正义的事情就勇敢地去做。","source":"《论语·为政》","example":"他见义勇为，跳进河里救起了落水儿童。","tags":["褒义","人物","品德"],"story":"孔子在《论语》中说：见义不为，无勇也。看到正义的事却不做，就是没有勇气。后来演变为见义勇为。","usage":"用于赞美勇敢地做正义之事的行为。"},{"idiom":"舍己为人","pinyin":"she ji wei ren","meaning":"为了他人而牺牲自己的利益。","source":"《论语·先进》","example":"他这种舍己为人的精神值得我们学习。","tags":["褒义","人物","品德"],"story":"孔子提倡己欲立而立人，己欲达而达人，强调在追求自己发展的同时也要帮助他人发展，舍己为人是这种思想的高度体现。","usage":"用于赞美牺牲个人利益、帮助他人的高尚品德。"},{"idiom":"任劳任怨","pinyin":"ren lao ren yuan","meaning":"做事不辞辛苦，不怕别人埋怨。","source":"汉·桓宽《盐铁论》","example":"她在岗位上任劳任怨工作了三十年。","tags":["褒义","品质","工作"],"story":"《盐铁论》中谈到为官之道时，强调要能承担繁重的工作而不抱怨，面对非议也不退缩。","usage":"用于赞美在工作中勤恳踏实、不计较得失的人。"},{"idiom":"尊老爱幼","pinyin":"zun lao ai you","meaning":"尊敬长辈，爱护晚辈。","source":"《孟子·梁惠王上》","example":"尊老爱幼是中华民族的传统美德。","tags":["褒义","品德","社会"],"story":"孟子说：老吾老以及人之老，幼吾幼以及人之幼。主张不仅要尊敬自己的长辈、爱护自己的晚辈，还要推广到尊敬、爱护别人的长辈和晚辈。","usage":"用于倡导和赞美中华民族的传统美德。"},{"idiom":"助人为乐","pinyin":"zhu ren wei le","meaning":"以帮助他人为快乐。","source":"《论语·雍也》","example":"他从小就养成了助人为乐的好习惯。","tags":["褒义","品德","人物"],"story":"孔子说：己欲立而立人，己欲达而达人。主张在帮助别人的过程中实现自己的价值，把帮助他人当作快乐。","usage":"用于赞美乐于帮助他人的人。"},{"idiom":"光明磊落","pinyin":"guang ming lei luo","meaning":"心地光明坦白，胸怀坦荡。","source":"《晋书·石勒载记》","example":"做人要光明磊落，不做亏心事。","tags":["褒义","品质","品德"],"story":"《晋书》评价石勒虽出身低微但心胸开阔、行事光明磊落，有大丈夫之风范。后人用来形容为人正派、坦荡。","usage":"用于赞美为人正直坦荡、没有私心。"},{"idiom":"大公无私","pinyin":"da gong wu si","meaning":"办事公正，没有私心。","source":"《汉书·贾谊传》","example":"作为法官，必须大公无私地审理每一个案件。","tags":["褒义","品质","品德"],"story":"贾谊在《治安策》中强调为官者应当大公无私，以国家利益为重。后成为对公务人员的基本要求。","usage":"用于赞美公正无私、不偏袒任何一方的态度和行为。"},{"idiom":"鞠躬尽瘁","pinyin":"ju gong jin cui","meaning":"恭敬谨慎，竭尽心力。","source":"三国蜀·诸葛亮《后出师表》","example":"他为教育事业鞠躬尽瘁，奉献了一生。","tags":["褒义","品质","人物"],"story":"诸葛亮在《后出师表》中写道：臣鞠躬尽瘁，死而后已。表达了自己为蜀汉政权竭尽全力、至死方休的决心。","usage":"用于赞美为某项事业尽心竭力、奉献一切的精神。"},{"idiom":"刚正不阿","pinyin":"gang zheng bu e","meaning":"刚强正直，不阿谀奉承。","source":"《明史·海瑞传》","example":"海瑞为官清廉，刚正不阿，深受百姓爱戴。","tags":["褒义","品质","人物"],"story":"明代清官海瑞一生刚正不阿，敢于直言进谏，甚至上书批评皇帝。他的正直品行成为后世为官的典范。","usage":"用于赞美为人正直、不屈服于权贵、不迎合世俗的人。"},{"idiom":"克己奉公","pinyin":"ke ji feng gong","meaning":"克制私欲，以公事为重。","source":"《后汉书·祭遵传》","example":"他一生克己奉公，两袖清风。","tags":["褒义","品质","人物"],"story":"《后汉书》记载将军祭遵一生克己奉公，把朝廷赏赐都分给部下，家中没有多余财产。","usage":"用于赞美严于律己、一心为公的品德。"},{"idiom":"兢兢业业","pinyin":"jing jing ye ye","meaning":"形容做事谨慎、勤奋、认真。","source":"《诗经·大雅·云汉》","example":"他几十年如一日兢兢业业地工作。","tags":["褒义","工作","态度"],"story":"《诗经》中写道：兢兢业业，如霆如雷。原指畏惧雷电而谨慎小心，后引申为做事勤奋、认真细致。","usage":"用于赞美对待工作勤恳认真、一丝不苟的态度。"},{"idiom":"勤勤恳恳","pinyin":"qin qin ken ken","meaning":"形容勤劳踏实，不辞辛苦。","source":"汉·司马迁《报任安书》","example":"他勤勤恳恳地工作了四十年，从未请过一次假。","tags":["褒义","工作","态度"],"story":"司马迁在《报任安书》中描述自己勤勤恳恳地为国家做事，形容勤劳不懈、态度诚恳。","usage":"用于赞美勤劳踏实、任劳任怨的人。"},{"idiom":"持之以恒","pinyin":"chi zhi yi heng","meaning":"有恒心地坚持下去。","source":"宋·朱熹《答周纯仁书》","example":"学习外语需要持之以恒的努力。","tags":["褒义","毅力","学习"],"story":"朱熹在给学生周纯仁的回信中指出，做学问贵在持之以恒，三天打鱼两天晒网是学不成的。","usage":"用于鼓励有恒心地坚持做某事。"},{"idiom":"自力更生","pinyin":"zi li geng sheng","meaning":"靠自己的力量改变局面，获得新生。","source":"《史记·平津侯主父列传》","example":"他们自力更生，在荒地上建起了自己的家园。","tags":["褒义","品质","行动"],"story":"《史记》中记载民众在困境中不依赖外力，靠自己的力量重新站起来。后成为中华民族自强不息精神的集中体现。","usage":"用于赞美不依赖外力、依靠自身力量获得发展的精神。"},{"idiom":"自强不息","pinyin":"zi qiang bu xi","meaning":"自己努力向上，永不松懈。","source":"《周易·乾卦》","example":"他身残志坚，自强不息的精神令人敬佩。","tags":["褒义","品质","哲理"],"story":"《周易》中说：天行健，君子以自强不息。天道运行刚健有力，君子应当效法天道，不断自我超越、永不停歇。","usage":"用于赞美不断自我努力、永不放弃的精神。"},{"idiom":"厚德载物","pinyin":"hou de zai wu","meaning":"以宽厚的德行承载万物，指品德宽厚、能担当大任。","source":"《周易·坤卦》","example":"清华大学的校训自强不息，厚德载物激励了一代代学子。","tags":["褒义","品德","哲理"],"story":"《周易》中说：地势坤，君子以厚德载物。大地宽厚和顺、承载万物，君子应当效法大地，以宽厚的德行包容和承载一切。","usage":"用于赞美品德敦厚、有包容力和担当的人。"},{"idiom":"气宇轩昂","pinyin":"qi yu xuan ang","meaning":"形容精神饱满、风度不凡。","source":"《三国演义》","example":"这位将军气宇轩昂，一看就不是凡人。","tags":["褒义","人物","仪表"],"story":"《三国演义》中描写诸葛亮出山时的形象：气宇轩昂、神采飞扬，一看就是经天纬地之才。","usage":"用于形容人精神饱满、风度翩翩、气质出众。"},{"idiom":"平易近人","pinyin":"ping yi jin ren","meaning":"态度谦逊和蔼，使人容易接近。","source":"《史记·鲁周公世家》","example":"这位教授平易近人，学生们都很喜欢他。","tags":["褒义","品质","人物"],"story":"周公旦身为周朝重臣但从不摆架子，对待百姓和下属都十分和善，史书评价他平易近民，后演变为平易近人。","usage":"用于赞美地位高或能力强的人态度谦和、不摆架子。"},{"idiom":"和蔼可亲","pinyin":"he ai ke qin","meaning":"态度温和，容易亲近。","source":"清·李宝嘉《官场现形记》","example":"这位老奶奶和蔼可亲，邻居们都很喜欢她。","tags":["褒义","品质","人物"],"story":"《官场现形记》中描写一位和善的官员，态度和蔼可亲，百姓都愿意与他交流。","usage":"用于赞美待人温和、亲切的人。"},{"idiom":"一丝不苟","pinyin":"yi si bu gou","meaning":"做事认真细致，一点儿不马虎。","source":"清·吴敬梓《儒林外史》","example":"他对工作要求一丝不苟，每个细节都要检查到位。","tags":["褒义","工作","态度"],"story":"《儒林外史》中描写一位认真的读书人，做事一丝不苟，连一个标点符号都不放过。形容极度认真负责的态度。","usage":"用于赞美做事极其认真仔细、不放过任何细节的人。"},{"idiom":"善始善终","pinyin":"shan shi shan zhong","meaning":"有好的开头，也有好的结尾，形容办事认真。","source":"《庄子·大宗师》","example":"做任何事情都要善始善终，不能虎头蛇尾。","tags":["褒义","品质","做事"],"story":"庄子说：善始善终，人皆知之。意思是人都知道做事要有始有终，但真正做到的人很少。强调坚持到底的重要性。","usage":"用于赞美做事从头到尾都认真负责。"},{"idiom":"古道热肠","pinyin":"gu dao re chang","meaning":"形容待人真挚、热情。","source":"清·李宝嘉《官场现形记》","example":"这位老先生古道热肠，街坊邻居有困难他都帮忙。","tags":["褒义","品质","人物"],"story":"《官场现形记》中描写一位老者为人古道热肠，乐于助人。古道指古代淳朴的风尚，热肠指热心肠。","usage":"用于赞美为人真诚、热心助人的人。"},{"idiom":"开诚布公","pinyin":"kai cheng bu gong","meaning":"以诚心待人，坦白无私。","source":"《三国志·蜀书·诸葛亮传》","example":"大家开诚布公地谈一谈，把问题说清楚。","tags":["褒义","品质","沟通"],"story":"《三国志》评价诸葛亮：开诚心，布公道。称赞他对谁都坦诚相待、公正无私。","usage":"用于倡导坦诚交流、公开讨论的态度。"},{"idiom":"推心置腹","pinyin":"tui xin zhi fu","meaning":"把自己的心推入对方的腹中，比喻真心待人。","source":"《后汉书·光武帝纪》","example":"两人推心置腹地聊了一夜，消除了所有隔阂。","tags":["褒义","品质","沟通"],"story":"刘秀击败敌军后，以赤诚之心对待降将，与他们推心置腹地交谈。将领们深受感动，说刘秀推赤心置人腹中。","usage":"用于形容真诚相待、毫无保留地交流。"},{"idiom":"言而有信","pinyin":"yan er you xin","meaning":"说话靠得住，有信用。","source":"《论语·学而》","example":"他言而有信，答应的事一定会做到。","tags":["褒义","品质","诚信"],"story":"孔子在《论语》中告诫弟子：与朋友交，言而有信。强调与人交往要讲信用、守承诺。","usage":"用于赞美讲信用、守承诺的人。"},{"idiom":"表里如一","pinyin":"biao li ru yi","meaning":"外表和内心一致，形容言行和思想完全一致。","source":"《论语·颜渊》","example":"他为人表里如一，从不虚伪做作。","tags":["褒义","品质","品德"],"story":"孔子说：君子坦荡荡。真正的君子表里如一，内心想什么就说什么、做什么，不虚伪、不掩饰。","usage":"用于赞美为人真诚、不虚伪的品格。"},{"idiom":"见利忘义","pinyin":"jian li wang yi","meaning":"看到有利可图就忘记了道义。","source":"《汉书·樊哙传》","example":"做生意不能见利忘义，要诚信经营。","tags":["贬义","品德","警示"],"story":"《汉书》记载樊哙等人为了利益背弃道义的行为，批评他们把利益置于道义之上。","usage":"用于批评那些为了利益不择手段、背弃道德的人。"},{"idiom":"忘恩负义","pinyin":"wang en fu yi","meaning":"忘记别人对自己的恩德，做出对不起别人的事。","source":"《魏书·萧宝夤传》","example":"他受了别人那么多帮助却恩将仇报，真是忘恩负义。","tags":["贬义","品德","警示"],"story":"《魏书》批评那些得到帮助后不但不感恩反而背叛恩人的人，认为忘恩负义是小人所为。","usage":"用于批评忘记别人恩情、背叛恩人的行为。"},{"idiom":"虚张声势","pinyin":"xu zhang sheng shi","meaning":"假装出强大的气势来吓唬人。","source":"唐·韩愈《论淮西事宜状》","example":"他不过是虚张声势，实际上并没有那么厉害。","tags":["贬义","行为","警示"],"story":"韩愈在《论淮西事宜状》中指出，有些将领面对敌人时虚张声势以掩盖实力的不足，这不是长久之计。","usage":"用于批评故意夸大实力或气势来吓唬人的行为。"},{"idiom":"弄虚作假","pinyin":"nong xu zuo jia","meaning":"搞虚假的一套欺骗人。","source":"《三国志·魏书·王昶传》","example":"学术研究不能弄虚作假，要实事求是。","tags":["贬义","行为","警示"],"story":"王昶在诫子书中告诫子孙为人要诚实，弄虚作假或许能骗人一时，但终究会败露。","usage":"用于批评制造虚假信息欺骗他人的行为。"},{"idiom":"投机取巧","pinyin":"tou ji qu qiao","meaning":"利用时机和巧妙手段谋取不正当利益。","source":"《朱子语类》","example":"学习不能投机取巧，要脚踏实地。","tags":["贬义","行为","警示"],"story":"朱熹在教学中批评那些不想下苦功夫、只想走捷径的学生，认为投机取巧是治学的大忌。","usage":"用于批评不踏实用功、专找捷径的行为。"},{"idiom":"趋炎附势","pinyin":"qu yan fu shi","meaning":"奉承依附有权有势的人。","source":"《宋史·李垂传》","example":"他最看不起那些趋炎附势的小人。","tags":["贬义","行为","人物"],"story":"李垂为人正直，有人劝他去拜见权贵，他说：我如果趋炎附势，早就是高官了。拒绝攀附权贵。","usage":"用于批评巴结、依附权势的人。"},{"idiom":"见风使舵","pinyin":"jian feng shi duo","meaning":"看风向转舵，比喻看形势或别人眼色行事。","source":"宋·释普济《五灯会元》","example":"他这个人最会见风使舵，谁得势就巴结谁。","tags":["贬义","行为","人物"],"story":"《五灯会元》中以看风使舵比喻随机应变。在世俗用法中偏向贬义，指人没有原则、见机行事。","usage":"用于批评那些没有原则、见机行事、随机应变的人，含贬义。"},{"idiom":"朝三暮四","pinyin":"zhao san mu si","meaning":"原指用诈术欺骗人，后比喻反复无常、变来变去。","source":"《庄子·齐物论》","example":"他谈恋爱总是朝三暮四，没有一段长久的关系。","tags":["贬义","行为","人格"],"story":"养猴人给猴子分橡子，说早上三颗晚上四颗，猴子不满。养猴人改口说早上四颗晚上三颗，猴子就满意了。庄子用这个故事讽刺人们被表面变化所迷惑。","usage":"用于批评感情或态度反复无常、不专一。"},{"idiom":"朝令夕改","pinyin":"zhao ling xi gai","meaning":"早晨下的命令晚上就改了，形容政策或主张变化无常。","source":"汉·晁错《论贵粟疏》","example":"政策不能朝令夕改，否则百姓无所适从。","tags":["贬义","管理","警示"],"story":"晁错在《论贵粟疏》中批评朝廷政策不稳定，朝令夕改让百姓无法适应，影响国家治理。","usage":"用于批评政策、规定等变化太快、缺乏稳定性。"},{"idiom":"阳奉阴违","pinyin":"yang feng yin wei","meaning":"表面上遵从，暗地里违背。","source":"明·范景文《革大户行召募疏》","example":"他对上级的命令阳奉阴违，导致项目进度严重滞后。","tags":["贬义","行为","职场"],"story":"明代官员范景文上疏批评那些表面上服从命令、背地里却另搞一套的官员，认为阳奉阴违是官场大弊。","usage":"用于批评表面服从、实际违背的两面派行为。"},{"idiom":"口是心非","pinyin":"kou shi xin fei","meaning":"嘴里说的是一套，心里想的却是另一套。","source":"《抱朴子·微旨》","example":"他说得很动听，但口是心非，不能相信。","tags":["贬义","行为","人格"],"story":"葛洪在《抱朴子》中批评那些口是心非、表里不一的人，认为这是虚伪的表现，与君子之道背道而驰。","usage":"用于批评言行不一致、表里不一的人。"},{"idiom":"颠倒是非","pinyin":"dian dao shi fei","meaning":"把对的说成错的，把错的说成对的。","source":"唐·韩愈《施先生墓铭》","example":"他为了逃避责任，不惜颠倒是非、混淆黑白。","tags":["贬义","行为","警示"],"story":"韩愈在墓铭中批评那些故意颠倒是非的人，认为这是最严重的道德败坏之一。","usage":"用于批评故意混淆对错、歪曲事实的行为。"},{"idiom":"横行霸道","pinyin":"heng xing ba dao","meaning":"依仗势力胡作非为，欺压别人。","source":"《红楼梦》","example":"他在村里横行霸道，欺压百姓，终于受到了法律的制裁。","tags":["贬义","行为","人物"],"story":"《红楼梦》中描写薛蟠仗着家势横行霸道、欺男霸女的恶行，成为纨绔子弟的典型。","usage":"用于批评仗势欺人、胡作非为的行为。"},{"idiom":"目中无人","pinyin":"mu zhong wu ren","meaning":"眼里没有别人，形容骄傲自大、看不起人。","source":"《初刻拍案惊奇》","example":"他取得一点成绩就目中无人，大家都不喜欢他。","tags":["贬义","人格","态度"],"story":"《初刻拍案惊奇》中描写一些暴发户得势后目中无人、得意忘形，最终自取其辱的教训。","usage":"用于批评骄傲自大、不把别人放在眼里的人。"},{"idiom":"自高自大","pinyin":"zi gao zi da","meaning":"自以为了不起，看不起别人。","source":"三国魏·曹丕《典论·论文》","example":"他自高自大，听不进任何人的意见。","tags":["贬义","人格","态度"],"story":"曹丕在《典论·论文》中批评文人们各以所长，相轻所短，指出自高自大是文人的通病，阻碍进步。","usage":"用于批评过高估计自己、轻视他人的态度。"},{"idiom":"故步自封","pinyin":"gu bu zi feng","meaning":"把自己限制在原来的地方，比喻因循守旧、不求进步。","source":"《汉书·叙传上》","example":"企业如果不能创新，只会故步自封，终将被市场淘汰。","tags":["贬义","态度","警示"],"story":"《汉书》中用故步指原来的步伐，自封指自我限制。比喻满足于现状、不愿改变和进步。","usage":"用于批评因循守旧、不愿创新和进步的态度。"},{"idiom":"鼠目寸光","pinyin":"shu mu cun guang","meaning":"老鼠的眼睛只能看到一寸远的地方，比喻目光短浅。","source":"《史记·李斯列传》","example":"只考虑眼前利益是鼠目寸光的表现。","tags":["动物","贬义","警示"],"story":"李斯以厕鼠和仓鼠的不同命运为例，说明眼光和格局决定了人生的高度。鼠目寸光的人只看眼前，没有长远规划。","usage":"用于批评目光短浅、只顾眼前利益的人。"},{"idiom":"坐井观天","pinyin":"zuo jing guan tian","meaning":"坐在井里看天，比喻眼界狭窄、见识有限。","source":"唐·韩愈《原道》","example":"不出去走走，永远坐井观天，不知道世界有多大。","tags":["贬义","哲理","警示"],"story":"韩愈在《原道》中批评那些固守一隅的人，如同坐在井底看天，以为天只有井口那么大。","usage":"用于批评见识有限、视野狭窄的人。"},{"idiom":"画地为牢","pinyin":"hua di wei lao","meaning":"在地上画个圈当作监狱，比喻只许在规定的范围内活动。","source":"《庄子·人间世》","example":"不能被旧观念画地为牢，要敢于突破思维定式。","tags":["贬义","哲理","警示"],"story":"传说上古时期法律宽松，在地上画个圈让犯人站在里面就算关押了。后比喻自我限制、不敢越雷池一步。","usage":"用于批评自我设限、不敢突破规则或思维定式的行为。"},{"idiom":"削足适履","pinyin":"xue zu shi lv","meaning":"把脚削小了去适应鞋子，比喻不合理地迁就凑合。","source":"《淮南子·说林训》","example":"不能为了适应旧制度而削足适履，要改革制度本身。","tags":["贬义","哲理","警示"],"story":"《淮南子》中写道：削足而适履，杀头而便冠。讽刺那些为了迁就外物而损害自身的不合理做法。","usage":"用于批评为了迁就外部条件而不合理地改变自己的做法。"},{"idiom":"拔苗助长","pinyin":"ba miao zhu zhang","meaning":"把禾苗拔起来帮它生长，比喻急于求成、违反事物发展规律。","source":"《孟子·公孙丑上》","example":"教育孩子不能拔苗助长，要循序渐进。","tags":["贬义","哲理","警示"],"story":"宋国有个人嫌禾苗长得慢，就去把苗一棵棵拔高。累了一天回家说：今天我帮禾苗长高了。儿子跑去一看，苗都枯死了。","usage":"用于批评急于求成、违反客观规律的行为。"},{"idiom":"缘木求鱼","pinyin":"yuan mu qiu yu","meaning":"爬到树上去找鱼，比喻方向或方法不对，达不到目的。","source":"《孟子·梁惠王上》","example":"用这种方法解决问题，无异于缘木求鱼。","tags":["贬义","哲理","警示"],"story":"孟子对梁惠王说：您想实现霸业，却不用仁政，就像爬到树上去找鱼一样，不仅达不到目的，还可能带来祸患。","usage":"用于批评用错误的方法去追求目标的行为。"},{"idiom":"掩人耳目","pinyin":"yan ren er mu","meaning":"遮住别人的耳朵和眼睛，比喻用假象迷惑、欺骗别人。","source":"《大宋宣和遗事》","example":"他编了一个谎言来掩人耳目，但很快就被揭穿了。","tags":["贬义","行为","警示"],"story":"《大宋宣和遗事》中记载了一些官员用虚假的政绩来掩人耳目，欺骗朝廷和百姓，最终事情败露。","usage":"用于批评用虚假信息或表面文章来欺骗他人的行为。"},{"idiom":"学富五车","pinyin":"xue fu wu che","meaning":"形容读书多、学识丰富。","source":"《庄子·天下》","example":"这位教授学富五车，在学术界享有盛誉。","tags":["褒义","学习","人物"],"story":"惠施是战国时期的名家代表人物，庄子说他惠施多方，其书五车，用五辆车来装他的书籍，形容学识渊博。","usage":"用于赞美学识渊博的人。"},{"idiom":"才高八斗","pinyin":"cai gao ba dou","meaning":"形容文才极高。","source":"唐·李延寿《南史·谢灵运传》","example":"李白才高八斗，被誉为诗仙。","tags":["褒义","学习","人物"],"story":"谢灵运曾说：天下才共一石，曹子建独得八斗，我得一斗，自古及今共用一斗。自谦的同时高度赞美了曹植的才华。","usage":"用于赞美才华极高的人。"},{"idiom":"博古通今","pinyin":"bo gu tong jin","meaning":"通晓古今，知识渊博。","source":"《孔子家语·观周》","example":"他博古通今，讲起历史来引人入胜。","tags":["褒义","学习","人物"],"story":"孔子曾带领弟子到洛阳考察，研读古籍，学习礼乐制度。后人用博古通今来形容像孔子那样通晓古今的大学问家。","usage":"用于赞美知识渊博、通晓古今的人。"},{"idiom":"博览群书","pinyin":"bo lan qun shu","meaning":"广泛阅读各种书籍。","source":"《宋书·谢灵运传》","example":"他自幼博览群书，打下了坚实的学识基础。","tags":["褒义","学习","习惯"],"story":"谢灵运从小就酷爱读书，博览群书且过目不忘，为他后来的文学成就奠定了基础。","usage":"用于赞美阅读广泛、学识丰富的人。"},{"idiom":"融会贯通","pinyin":"rong hui guan tong","meaning":"把各方面的知识和道理融合贯穿起来，得到全面系统的理解。","source":"宋·朱熹《答张敬夫书》","example":"学习要善于将不同领域的知识融会贯通。","tags":["褒义","学习","能力"],"story":"朱熹在教学中强调，读书不能死记硬背，要把各种知识融会贯通，形成自己完整的认知体系。","usage":"用于赞美能将不同知识融为一炉、灵活运用的人。"},{"idiom":"勤能补拙","pinyin":"qin neng bu zhuo","meaning":"勤奋能够弥补笨拙的不足。","source":"宋·黄庭坚《跛奚移文》","example":"虽然天赋一般，但勤能补拙，他靠努力取得了优异的成绩。","tags":["褒义","学习","哲理"],"story":"黄庭坚在文中写道：勤能补拙，俭以养廉。强调勤奋可以弥补天资的不足，是后天努力改变命运的最好证明。","usage":"用于鼓励天资一般的人通过勤奋努力来弥补不足。"},{"idiom":"十年寒窗","pinyin":"shi nian han chuang","meaning":"形容长年刻苦读书。","source":"元·刘祁《归潜志》","example":"十年寒窗苦读，终于换来了金榜题名。","tags":["褒义","学习","毅力"],"story":"古代读书人常在寒冷的窗下苦读，刘祁在《归潜志》中记载了学子们十年如一日刻苦读书的场景，终有大成。","usage":"用于形容长期坚持刻苦学习的精神。"},{"idiom":"悬梁刺股","pinyin":"xuan liang ci gu","meaning":"用绳子系住头发挂在梁上，用锥子刺大腿，形容刻苦自学。","source":"《战国策·秦策一》","example":"古人悬梁刺股的学习精神值得我们敬佩。","tags":["褒义","学习","毅力"],"story":"孙敬读书时怕打瞌睡，就把头发系在房梁上。苏秦读书困倦时用锥子刺自己的大腿。两人后来都成了著名的大学问家。","usage":"用于形容学习极其刻苦、自我鞭策的精神。"},{"idiom":"凿壁偷光","pinyin":"zao bi tou guang","meaning":"在墙上凿洞借邻居的灯光读书，形容学习刻苦。","source":"晋·葛洪《西京杂记》","example":"匡衡凿壁偷光的故事激励着无数寒门学子。","tags":["褒义","学习","毅力"],"story":"汉代匡衡家里穷买不起蜡烛，就在墙上凿了个洞，借邻居家的灯光读书。后来成为大学者，官至丞相。","usage":"用于赞美在艰苦条件下坚持学习的刻苦精神。"},{"idiom":"业精于勤","pinyin":"ye jing yu qin","meaning":"学业或事业的精深在于勤奋。","source":"唐·韩愈《进学解》","example":"业精于勤，荒于嬉，这是千古不变的道理。","tags":["褒义","学习","哲理"],"story":"韩愈在《进学解》中写道：业精于勤，荒于嬉；行成于思，毁于随。强调勤奋和思考是学业成功的关键。","usage":"用于鼓励勤奋学习、努力工作。"},{"idiom":"学以致用","pinyin":"xue yi zhi yong","meaning":"为了实际应用而学习。","source":"《论语·子张》","example":"学习的目的是学以致用，把知识转化为能力。","tags":["褒义","学习","哲理"],"story":"子夏说：仕而优则学，学而优则仕。强调学习和实践要相互促进，学到的知识要能应用到实际中去。","usage":"用于强调学习要与实践相结合。"},{"idiom":"不学无术","pinyin":"bu xue wu shu","meaning":"没有学问，没有本领。","source":"《汉书·霍光传》","example":"他不学无术却喜欢指手画脚。","tags":["贬义","学习","人物"],"story":"《汉书》评价霍光不学无术，暗于大理，说霍光虽然功劳很大，但因为不读书、不学习，缺乏大局观和长远眼光。","usage":"用于批评没有知识、没有能力的人。"},{"idiom":"囫囵吞枣","pinyin":"hu lun tun zao","meaning":"把整个枣子吞下去，不加咀嚼。比喻读书不经过分析思考，笼统接受。","source":"宋·朱熹《答张敬夫书》","example":"读书不能囫囵吞枣，要仔细品味思考。","tags":["贬义","学习","态度"],"story":"朱熹在信中批评一些学者读书不求甚解，像囫囵吞枣一样，不知道消化吸收，学得再多也无用。","usage":"用于批评学习不动脑筋、不求深入理解的态度。"},{"idiom":"生吞活剥","pinyin":"sheng tun huo bo","meaning":"原指生硬地搬用别人的诗文，现比喻生硬地接受或机械模仿。","source":"唐·刘肃《大唐新语》","example":"学习外国经验不能生吞活剥，要结合本国实际。","tags":["贬义","学习","态度"],"story":"唐代有诗人抄袭张怀庆的诗句，别人讽刺说：活剥王昌龄，生吞郭正一。就是生吞活剥的由来。","usage":"用于批评生硬模仿、不加消化的学习方式。"},{"idiom":"围魏救赵","pinyin":"wei wei jiu zhao","meaning":"指袭击敌人后方据点迫使敌人撤兵的战术。","source":"《史记·孙子吴起列传》","example":"在谈判中，他采用围魏救赵的策略，通过解决旁的问题来推动核心问题的解决。","tags":["军事","历史","策略"],"story":"孙膑用围攻魏国都城大梁的办法，迫使攻赵的魏军回撤，在桂陵设伏大败魏军，解了赵国之围。","usage":"用于形容通过攻击对方要害来间接解决问题的策略。"},{"idiom":"暗度陈仓","pinyin":"an du chen cang","meaning":"比喻用假象迷惑对方，从而达成目的。","source":"《史记·高祖本纪》","example":"公司表面上在谈A项目，实际上是暗度陈仓，在和B公司谈合作。","tags":["军事","历史","策略"],"story":"刘邦被项羽封在汉中后，用韩信之计，表面上修栈道迷惑项羽，暗地里绕道陈仓攻入关中。","usage":"用于形容表面上做一件事、实际在做另一件事的谋略。"},{"idiom":"焚书坑儒","pinyin":"fen shu keng ru","meaning":"焚烧书籍，活埋儒生，指秦始皇的暴政。","source":"《史记·秦始皇本纪》","example":"焚书坑儒是文化史上的一场浩劫。","tags":["历史","贬义","事件"],"story":"秦始皇统一六国后，采纳李斯的建议，焚烧诸子百家书籍，活埋批评朝政的儒生四百六十多人，以统一思想。","usage":"用于指代文化专制和摧残文化的暴政。"},{"idiom":"指鹿为马","pinyin":"zhi lu wei ma","meaning":"指着鹿说是马，比喻故意颠倒黑白、混淆是非。","source":"《史记·秦始皇本纪》","example":"他这种指鹿为马的说法，是在故意混淆视听。","tags":["历史","贬义","人物"],"story":"赵高想测试群臣是否服从自己，就牵来一只鹿献给秦二世说是马。二世说这不是鹿吗？赵高坚持说是马。问左右大臣，有的沉默，有的附和说是马。","usage":"用于批评故意颠倒黑白、混淆是非的行为。"},{"idiom":"一鸣惊人","pinyin":"yi ming jing ren","meaning":"一声鸣叫使人震惊，比喻平时不显山露水，一下子做出惊人的成绩。","source":"《史记·滑稽列传》","example":"这位新人歌手首张专辑就一鸣惊人。","tags":["历史","褒义","人物"],"story":"齐威王不理朝政，淳于髡用隐语劝谏：国中有大鸟，不飞不鸣，这是什么鸟？齐威王说：此鸟不飞则已，一飞冲天；不鸣则已，一鸣惊人。","usage":"用于赞美平时不显眼、突然取得惊人成就的人。"},{"idiom":"退避三舍","pinyin":"tui bi san she","meaning":"主动退让九十里，比喻退让和回避。","source":"《左传·僖公二十三年》","example":"面对这个不讲理的人，他选择了退避三舍。","tags":["历史","中性","策略"],"story":"晋公子重耳逃亡到楚国，楚王问他将来如何报答。重耳说：如果晋楚交战，我就退避三舍（九十里）作为报答。后来重耳成为晋文公，在城濮之战中果然退避三舍。","usage":"用于形容主动退让、避免冲突的行为。"},{"idiom":"胯下之辱","pinyin":"kua xia zhi ru","meaning":"从别人胯下钻过去的耻辱，指极大的侮辱。","source":"《史记·淮阴侯列传》","example":"韩信能忍胯下之辱，最终成就了大业。","tags":["历史","中性","人物"],"story":"韩信年轻时被一个屠夫拦住说：你虽然个子高大、喜欢佩剑，但其实是胆小鬼。有胆量就杀了我，没胆量就从我胯下钻过去。韩信看了他很久，最终忍辱从他胯下钻了过去。","usage":"用于形容忍辱负重、能屈能伸的品格。"},{"idiom":"多多益善","pinyin":"duo duo yi shan","meaning":"越多越好。","source":"《史记·淮阴侯列传》","example":"做善事多多益善。","tags":["历史","中性","人物"],"story":"刘邦问韩信：我能带多少兵？韩信说：陛下不过能带十万。刘邦问：你呢？韩信说：多多益善。刘邦笑问：那你为什么被我抓住了？韩信说：陛下不能带兵但善于带将。","usage":"用于形容数量越大越好，不嫌多。"},{"idiom":"约法三章","pinyin":"yue fa san zhang","meaning":"约定三条法律，泛指订立简单明确的条款。","source":"《史记·高祖本纪》","example":"我们提前约法三章，避免了之后的纠纷。","tags":["历史","中性","管理"],"story":"刘邦攻入咸阳后，与关中父老约定三章法律：杀人者死，伤人及盗抵罪。废除了秦朝的严刑峻法，受到百姓拥护。","usage":"用于指双方事先约定好规则和条款。"},{"idiom":"空城计","pinyin":"kong cheng ji","meaning":"在危急关头以大胆的冒险行动来迷惑对方。","source":"《三国演义》","example":"他这招空城计玩得很漂亮，成功迷惑了对手。","tags":["历史","中性","策略"],"story":"诸葛亮因街亭失守，城中空虚。司马懿大军兵临城下，诸葛亮大开城门，自己在城楼上抚琴。司马懿疑有埋伏，退兵而去。","usage":"用于形容以虚张声势来迷惑对手的策略。"},{"idiom":"草船借箭","pinyin":"cao chuan jie jian","meaning":"运用智谋借他人的力量达到自己的目的。","source":"《三国演义》","example":"他这次成功说服对手出钱，真是草船借箭的高招。","tags":["历史","褒义","策略"],"story":"周瑜让诸葛亮十天内造十万支箭。诸葛亮在雾天用草船靠近曹营，曹军射箭，草船满载箭支而归，轻松完成任务。","usage":"用于形容借他人之力实现自己目的的巧妙方法。"},{"idiom":"火烧赤壁","pinyin":"huo shao chi bi","meaning":"比喻以智取胜，用巧妙的战术击败强大的对手。","source":"《三国志·吴书·周瑜传》","example":"在这场商战中，小公司用火烧赤壁的奇招击败了行业巨头。","tags":["历史","褒义","军事"],"story":"周瑜用黄盖的火攻计，趁东南风火烧曹操的连环战船，曹操大军溃败。奠定了三国鼎立的局面。","usage":"用于形容以弱胜强、以智取胜的壮举。"},{"idiom":"七步成诗","pinyin":"qi bu cheng shi","meaning":"走七步就能作一首诗，形容才思敏捷。","source":"《世说新语·文学》","example":"这位小诗人才思敏捷，几乎能七步成诗。","tags":["历史","褒义","人物"],"story":"曹丕命曹植在七步之内作诗，否则就要杀他。曹植应声吟道：煮豆燃豆萁，豆在釜中泣。本是同根生，相煎何太急？曹丕听后深感惭愧。","usage":"用于赞美人的才思敏捷、出口成章。"},{"idiom":"洛阳纸贵","pinyin":"luo yang zhi gui","meaning":"比喻作品风行一时、广为流传。","source":"《晋书·左思传》","example":"这本书出版后洛阳纸贵，一时成为热议话题。","tags":["历史","褒义","文学"],"story":"左思花十年时间写成《三都赋》，由于写得极好，豪贵之家争相传抄，洛阳的纸张供不应求，价格大涨。","usage":"用于形容作品极受欢迎、广为流传。"},{"idiom":"请君入瓮","pinyin":"qing jun ru weng","meaning":"比喻用某人整治别人的办法来整治他自己。","source":"《资治通鉴·唐纪》","example":"他本想陷害别人，没想到对方请君入瓮，让他自食其果。","tags":["历史","中性","策略"],"story":"武则天时期，酷吏周兴被告谋反。来俊臣奉命审讯，问周兴：囚犯不认罪怎么办？周兴说：把犯人放进大瓮里，用火烤。来俊臣说：那请君入瓮吧。周兴吓得认罪。","usage":"用于形容以其人之道还治其人之身。"},{"idiom":"龙飞凤舞","pinyin":"long fei feng wu","meaning":"形容气势奔放雄壮，多指书法笔势有力、灵活舒展。","source":"宋·苏轼《表忠观碑》","example":"他的草书龙飞凤舞，一气呵成。","tags":["动物","褒义","艺术"],"story":"苏轼在《表忠观碑》中以龙飞凤舞形容书法笔势的灵动和气势的磅礴，成为对书法艺术的高度赞美。","usage":"用于赞美书法笔势生动、气势磅礴。"},{"idiom":"虎头蛇尾","pinyin":"hu tou she wei","meaning":"头大如虎，尾细如蛇，比喻做事有始无终、前紧后松。","source":"元·康进之《李逵负荆》","example":"他做事情总是虎头蛇尾，开头轰轰烈烈，最后不了了之。","tags":["动物","贬义","做事"],"story":"康进之在《李逵负荆》中以虎头蛇尾来形容人做事开始时声势浩大，但到后来就草草收场，缺乏坚持。","usage":"用于批评做事不能坚持到底、前紧后松的行为。"},{"idiom":"狼吞虎咽","pinyin":"lang tun hu yan","meaning":"像狼和虎一样吞咽食物，形容吃东西又急又猛。","source":"明·凌濛初《初刻拍案惊奇》","example":"他饿了一天，看到饭菜就狼吞虎咽地吃起来。","tags":["动物","中性","形容"],"story":"《初刻拍案惊奇》中描写饥民见到食物时狼吞虎咽的样子，形容极度饥饿时吃东西的急切模样。","usage":"用于形容吃东西又快又急的样子。"},{"idiom":"龙腾虎跃","pinyin":"long teng hu yue","meaning":"像龙在腾飞、虎在跳跃，形容生气勃勃、充满活力。","source":"唐·严复《天演论》","example":"操场上同学们龙腾虎跃，充满青春活力。","tags":["动物","褒义","形容"],"story":"原形容龙虎跳跃腾飞的威猛姿态，后引申为形容人精神振奋、充满活力地投入活动中。","usage":"用于形容充满活力、气氛热烈的场景。"},{"idiom":"鸦雀无声","pinyin":"ya que wu sheng","meaning":"连乌鸦和麻雀的叫声都没有，形容非常安静。","source":"宋·释道原《景德传灯录》","example":"老师走进教室时，原本吵闹的教室顿时鸦雀无声。","tags":["动物","中性","形容"],"story":"《景德传灯录》中记载禅师说法时，周围鸦雀无声，连乌鸦和麻雀都不叫了，形容一片寂静。","usage":"用于形容环境非常安静、没有一丝声音。"},{"idiom":"如鱼得水","pinyin":"ru yu de shui","meaning":"像鱼得到水一样，比喻得到与自己非常投合的人或适合自己的环境。","source":"《三国志·蜀书·诸葛亮传》","example":"他来到这家公司后如鱼得水，充分发挥了自己的才华。","tags":["动物","褒义","比喻"],"story":"刘备得到诸葛亮辅佐后说：我得到诸葛亮，就像鱼得到水一样。形容君臣之间高度契合、相得益彰。","usage":"用于形容找到了适合自己的环境或合适的人。"},{"idiom":"马到成功","pinyin":"ma dao cheng gong","meaning":"战马一到就胜利了，形容事情顺利、一开始就取得成功。","source":"元·郑廷玉《楚昭公》","example":"祝你这次项目马到成功！","tags":["动物","褒义","祝福"],"story":"古代战争中，武将骑马出征，马到就代表抵达战场，马到成功即一到战场就取得胜利。后用作祝福语。","usage":"常用于祝福他人事业顺利、旗开得胜。"},{"idiom":"龙马精神","pinyin":"long ma jing shen","meaning":"比喻精神旺盛。","source":"唐·李郢《上裴晋公》","example":"老人家虽然年过七旬，但依然龙马精神。","tags":["动物","褒义","人物"],"story":"龙马是古代传说中的神马，李郢在诗中用龙马精神来形容老年人身体健壮、精力充沛。","usage":"用于赞美老年人身体健康、精神矍铄。"},{"idiom":"虎视眈眈","pinyin":"hu shi dan dan","meaning":"像老虎一样凶狠地盯着，形容心怀不良、伺机攫取。","source":"《周易·颐卦》","example":"竞争对手对这个市场虎视眈眈，我们必须抢在前面。","tags":["动物","贬义","形容"],"story":"《周易》中说：虎视眈眈，其欲逐逐。形容老虎凶狠地盯着猎物，随时准备扑上去捕捉。后比喻心怀不轨、密切窥伺。","usage":"用于形容心怀不轨、时刻准备下手攫取的样子。"},{"idiom":"鹏程万里","pinyin":"peng cheng wan li","meaning":"大鹏鸟能飞万里远，比喻前程远大。","source":"《庄子·逍遥游》","example":"祝你鹏程万里，前程似锦！","tags":["动物","褒义","祝福"],"story":"庄子在《逍遥游》中说大鹏鸟振翅高飞九万里，从北海飞往南海。比喻志向远大、前途无量。","usage":"用于祝福他人前程远大、事业辉煌。"},{"idiom":"惊弓之鸟","pinyin":"jing gong zhi niao","meaning":"被弓箭吓怕了的鸟，比喻受过惊吓的人遇到类似情况就惶恐不安。","source":"《战国策·楚策四》","example":"经历了那次失败后，他就像惊弓之鸟，再也不敢尝试了。","tags":["动物","贬义","心理"],"story":"更羸拉弓不射箭就把一只大雁射了下来。魏王很惊讶，更羸说：这只雁飞得慢叫声悲，是因为受过箭伤、伤口还没好。听到弓弦声就拼命高飞，伤口裂开掉了下来。","usage":"用于形容受过打击后心有余悸、过分敏感的人。"},{"idiom":"马不停蹄","pinyin":"ma bu ting ti","meaning":"马不停下脚步，比喻不停顿地向前走或连续不停地做事。","source":"元·王实甫《西厢记》","example":"他马不停蹄地奔波于各个城市之间。","tags":["动物","中性","行动"],"story":"《西厢记》中描写张生为了追求崔莺莺，马不停蹄地赶路，一刻也不停歇。后形容连续不停地做事。","usage":"用于形容连续不停地忙碌或奔波。"},{"idiom":"一马当先","pinyin":"yi ma dang xian","meaning":"策马走在最前面，形容领先、起带头作用。","source":"《水浒传》","example":"在技术研发上，这家公司一马当先。","tags":["动物","褒义","行动"],"story":"《水浒传》中描写梁山好汉作战时，一马当先冲在最前面的勇猛表现。后引申为在各领域中起带头作用。","usage":"用于赞美在某个领域中处于领先地位或起带头作用的人或集体。"},{"idiom":"如虎添翼","pinyin":"ru hu tian yi","meaning":"好像老虎长出了翅膀，比喻强有力的人得到帮助变得更加强大。","source":"三国蜀·诸葛亮《心书》","example":"公司引进了顶尖技术团队，如虎添翼，竞争力大幅提升。","tags":["动物","褒义","比喻"],"story":"诸葛亮在《心书》中说：将领善于用兵，又能得到贤才辅佐，就如虎添翼。强调好的辅助能让强者更强。","usage":"用于形容强者得到额外助力后更加强大。"},{"idiom":"杀鸡儆猴","pinyin":"sha ji jing hou","meaning":"杀掉鸡来吓唬猴子，比喻惩罚一个人来警告其他人。","source":"清·李宝嘉《官场现形记》","example":"公司开除了这名违规员工，杀鸡儆猴以正纪律。","tags":["动物","中性","管理"],"story":"古代训练猴子的人，会在猴子面前杀鸡，让猴子看到不听话的后果。后用来比喻通过惩罚个别人来警示其他人的管理手段。","usage":"用于形容通过惩罚个别人来震慑其他大多数人的做法。"},{"idiom":"顺手牵羊","pinyin":"shun shou qian yang","meaning":"顺手把羊牵走，比喻乘机拿走别人的东西。","source":"《礼记·曲礼上》","example":"他趁人不注意顺手牵羊，偷走了桌上的手机。","tags":["动物","贬义","行为"],"story":"《礼记》中效马效羊者右牵之，后人引申为顺手牵羊，指顺便拿走别人的东西。在三十六计中也是其中一计。","usage":"用于批评乘机偷盗或占小便宜的行为。"},{"idiom":"欲速则不达","pinyin":"yu su ze bu da","meaning":"过于追求速度反而达不到目的。","source":"《论语·子路》","example":"做事要一步一个脚印，欲速则不达。","tags":["哲理","警示","做事"],"story":"子夏做莒父的邑宰，问孔子如何治理。孔子说：欲速则不达，见小利则大事不成。告诫他不要急于求成。","usage":"用于劝诫不要急功近利、要循序渐进。"},{"idiom":"大智若愚","pinyin":"da zhi ruo yu","meaning":"有大智慧的人看起来好像很愚笨，指才智很高而不露锋芒。","source":"宋·苏轼《贺欧阳少师致仕启》","example":"这位老教授大智若愚，看似平凡却见解深刻。","tags":["哲理","褒义","人物"],"story":"苏轼在贺文中称赞欧阳修大智若愚，大巧若拙，有大智慧的人不炫耀自己，外表看起来甚至有些木讷。","usage":"用于赞美那些真正有大智慧却不露锋芒的人。"},{"idiom":"否极泰来","pinyin":"pi ji tai lai","meaning":"逆境达到极点就会向顺境转化，坏运到头好运就来了。","source":"《周易·否卦》","example":"不要灰心，否极泰来，情况一定会好转的。","tags":["哲理","褒义","命运"],"story":"《周易》中否卦和泰卦是相对的，否代表闭塞、不顺，泰代表通达、顺利。否极泰来表示事物发展到极端就会向相反方向转化。","usage":"用于鼓励在逆境中保持希望，相信情况会好转。"},{"idiom":"物极必反","pinyin":"wu ji bi fan","meaning":"事物发展到极点就会向相反方向转化。","source":"《吕氏春秋·博志》","example":"任何事物都要适度，物极必反。","tags":["哲理","中性","规律"],"story":"《吕氏春秋》中说：全则必缺，极则必反。事物达到了极致就一定会走向反面，这是自然界的普遍规律。","usage":"用于提醒做事要适度、掌握分寸，不要走极端。"},{"idiom":"因材施教","pinyin":"yin cai shi jiao","meaning":"根据学习者的能力、兴趣等不同情况有针对性地进行教育。","source":"《论语·先进》","example":"好的老师懂得因材施教，让每个学生都能发挥所长。","tags":["哲理","褒义","教育"],"story":"孔子对不同学生问的同一个问题给出不同的回答。子路问闻斯行诸，孔子说有父兄在；冉有问同样的问题，孔子说闻斯行之。因为两人性格不同。","usage":"用于强调教育要根据学生的特点采取不同的方法。"},{"idiom":"循序渐进","pinyin":"xun xu jian jin","meaning":"按照一定的顺序、步骤逐渐推进。","source":"《论语·宪问》","example":"学习语言要循序渐进，不能急于求成。","tags":["哲理","褒义","方法"],"story":"孔子说：不怨天，不尤人，下学而上达。强调学习要从基础开始，一步步提高，不能跳跃式前进。","usage":"用于强调按照规律逐步推进的工作方法。"},{"idiom":"量力而行","pinyin":"liang li er xing","meaning":"按照自己力量的大小去做事，不要勉强。","source":"《左传·昭公十五年》","example":"投资要量力而行，不要超出自己的承受能力。","tags":["哲理","中性","做事"],"story":"《左传》中说：力能则进，否则退，量力而行。强调做事情要根据自己的实际能力来定，不要做超出能力范围的事。","usage":"用于提醒做事要实事求是、不过度勉强。"},{"idiom":"见微知著","pinyin":"jian wei zhi zhu","meaning":"看到微小的苗头就能知道事物的实质或发展趋势。","source":"《韩非子·说林上》","example":"一个好的管理者要能见微知著，及时发现潜在问题。","tags":["哲理","褒义","能力"],"story":"商纣王用了象牙筷子，箕子就认为纣王会逐渐追求更奢华的生活，最终导致亡国。韩非子用这个例子说明见微知著的智慧。","usage":"用于赞美能从细微之处洞察本质或预见趋势的洞察力。"},{"idiom":"因势利导","pinyin":"yin shi li dao","meaning":"顺着事物发展的趋势加以引导。","source":"《史记·孙子吴起列传》","example":"做管理要懂得因势利导，而不是强行改变。","tags":["哲理","褒义","方法"],"story":"孙膑在围魏救赵时，利用魏军急于求成的心理，因势利导，设伏于桂陵大败魏军。强调顺应形势引导。","usage":"用于强调顺应发展趋势进行引导的方法。"},{"idiom":"扬长避短","pinyin":"yang chang bi duan","meaning":"发挥长处，回避短处。","source":"《史记·淮阴侯列传》","example":"在职场中要善于扬长避短，发挥自己的优势。","tags":["哲理","褒义","方法"],"story":"韩信分析楚汉双方优劣时指出，要善于发挥己方优势、避开劣势。后人总结为取长补短、扬长避短的策略。","usage":"用于强调发挥优势、规避劣势的策略。"},{"idiom":"博采众长","pinyin":"bo cai zhong chang","meaning":"广泛采纳各家的长处。","source":"《魏书·刘芳传》","example":"一个优秀的艺术家要善于博采众长。","tags":["哲理","褒义","方法"],"story":"刘芳在《魏书》中被评价为博采众长，广泛吸收各家学说的优点，形成了自己独特的思想体系。","usage":"用于赞美善于吸收和借鉴各种优点的人。"},{"idiom":"厚积薄发","pinyin":"hou ji bo fa","meaning":"充分积累，少量释放，比喻经过长期积累后展现出才华。","source":"宋·苏轼《稼说》","example":"他多年的研究成果终于在这次会议上厚积薄发。","tags":["哲理","褒义","方法"],"story":"苏轼在《稼说》中写道：博观而约取，厚积而薄发。强调广泛阅读后精要地吸收，充分积累后慢慢地展现。","usage":"用于赞美经过长期积累后展现出非凡的才华与成就。"},{"idiom":"审时度势","pinyin":"shen shi duo shi","meaning":"观察时机、估量形势。","source":"明·沈德符《万历野获编》","example":"优秀的将领要善于审时度势，做出正确的判断。","tags":["哲理","褒义","能力"],"story":"沈德符在《万历野获编》中强调，在复杂局势中要能审时度势，准确判断时机和形势，从而做出正确决策。","usage":"用于赞美善于观察和判断时局的能力。"},{"idiom":"随机应变","pinyin":"sui ji ying bian","meaning":"随着情况的变化灵活机动地应付。","source":"《三国志·吴书·周瑜传》","example":"好的主持人要能随机应变，应对各种突发状况。","tags":["哲理","褒义","能力"],"story":"《三国志》评价周瑜随机应变，称赞他在赤壁之战中灵活应变的军事指挥才能。","usage":"用于赞美灵活应对变化的应变能力。"},{"idiom":"取长补短","pinyin":"qu chang bu duan","meaning":"吸取别人的长处来弥补自己的短处。","source":"《孟子·滕文公上》","example":"同学之间要互相学习，取长补短。","tags":["哲理","褒义","方法"],"story":"孟子说：今滕，绝长补短，将五十里也。原指土地面积的折算方法，后引申为学习他人的优点来弥补自己的不足。","usage":"用于倡导互相学习、互相借鉴的合作态度。"},{"idiom":"未雨绸缪","pinyin":"wei yu chou mou","meaning":"趁着天还没下雨就修缮好门窗，比喻事先做好准备。","source":"《诗经·豳风·鸱鸮》","example":"投资要未雨绸缪，考虑各种可能的风险。","tags":["哲理","褒义","态度"],"story":"《诗经》中写道：迨天之未阴雨，彻彼桑土，绸缪牖户。趁着天还没下雨，剥些桑树皮把门窗绑牢固。比喻事先做好准备。","usage":"用于强调做事要提前做准备、防范于未然。"},{"idiom":"仪表堂堂","pinyin":"yi biao tang tang","meaning":"形容容貌端正、风度威严。","source":"《三国演义》","example":"这位先生仪表堂堂，谈吐不凡。","tags":["人物","褒义","仪表"],"story":"《三国演义》中描写诸葛亮身长八尺，面如冠玉，头戴纶巾，身披鹤氅，飘飘然有神仙之概，仪表堂堂，器宇不凡。","usage":"用于赞美男子容貌端正、风度翩翩。"},{"idiom":"眉清目秀","pinyin":"mei qing mu xiu","meaning":"眉毛清秀，眼目明亮，形容容貌清秀俊美。","source":"元·无名氏《神奴儿》","example":"这个小姑娘眉清目秀，十分可爱。","tags":["人物","褒义","仪表"],"story":"元代杂剧中常用眉清目秀来形容年轻男女的俊美长相，指五官端正、气质清秀。","usage":"用于形容人容貌清秀、好看。"},{"idiom":"虎背熊腰","pinyin":"hu bei xiong yao","meaning":"背宽厚如虎，腰粗壮如熊，形容人身材魁梧健壮。","source":"元·无名氏《飞刀对箭》","example":"这位举重运动员虎背熊腰，力大无穷。","tags":["人物","中性","仪表"],"story":"元代戏曲中常用虎背熊腰来形容武将的魁梧身材，形象生动地描绘出人高大强壮的外形特征。","usage":"用于形容男子身材高大健壮。"},{"idiom":"慈眉善目","pinyin":"ci mei shan mu","meaning":"形容仁慈善良的相貌。","source":"清·李宝嘉《官场现形记》","example":"这位老奶奶慈眉善目，让人感到亲切温暖。","tags":["人物","褒义","仪表"],"story":"《官场现形记》中描写一位慈祥的老人，慈眉善目、和蔼可亲，一看就是心地善良之人。","usage":"用于形容老年人面容慈祥、和蔼可亲。"},{"idiom":"道貌岸然","pinyin":"dao mao an ran","meaning":"神态庄重严肃，现多含贬义，形容故作正经、表里不一。","source":"《庄子·渔父》","example":"别看他道貌岸然的样子，背地里尽干些见不得人的事。","tags":["人物","贬义","仪表"],"story":"庄子在《渔父》中批评那些外表装得一本正经、内心却充满私欲的人，认为这种道貌岸然的人最虚伪。","usage":"用于批评那些外表正经、实际虚伪的人。"},{"idiom":"花容月貌","pinyin":"hua rong yue mao","meaning":"如花似月的容貌，形容女子美丽。","source":"明·吴承恩《西游记》","example":"这位姑娘花容月貌，美若天仙。","tags":["人物","褒义","仪表"],"story":"《西游记》中描写女儿国国王花容月貌，赛过西施，用花和月来比喻女子容貌的美丽。","usage":"用于赞美女子容貌极为美丽。"},{"idiom":"一表人才","pinyin":"yi biao ren cai","meaning":"形容人相貌英俊、风度出众。","source":"明·冯梦龙《喻世明言》","example":"这位年轻人一表人才，前途不可限量。","tags":["人物","褒义","仪表"],"story":"《喻世明言》中描写才子佳人的故事时，常用一表人才来形容男主角相貌出众、气质不凡。","usage":"用于赞美男子相貌英俊、气质出众。"},{"idiom":"落落大方","pinyin":"luo luo da fang","meaning":"形容言谈举止自然、不拘谨。","source":"清·文康《儿女英雄传》","example":"她在台上落落大方，毫不怯场。","tags":["人物","褒义","气质"],"story":"《儿女英雄传》中描写一位知书达理的女子，待人接物落落大方，既有教养又不做作。","usage":"用于赞美人的举止自然得体、不拘束。"},{"idiom":"温文尔雅","pinyin":"wen wen er ya","meaning":"态度温和、举止文雅。","source":"清·蒲松龄《聊斋志异》","example":"这位学者温文尔雅，谈吐不凡。","tags":["人物","褒义","气质"],"story":"蒲松龄在《聊斋志异》中描写书生时常用温文尔雅来形容其温和有礼、文雅谦逊的气质。","usage":"用于赞美态度温和、举止有礼、有教养的人。"},{"idiom":"彬彬有礼","pinyin":"bin bin you li","meaning":"文雅而有礼貌。","source":"《论语·雍也》","example":"这位服务员彬彬有礼，服务周到。","tags":["人物","褒义","气质"],"story":"孔子说：文质彬彬，然后君子。文采和质朴配合得当，才算君子。后演变为彬彬有礼，形容举止文雅有礼貌。","usage":"用于赞美待人接物恭敬有礼的态度。"},{"idiom":"风度翩翩","pinyin":"feng du pian pian","meaning":"形容举止洒脱、姿态优美。","source":"《史记·平原君列传》","example":"这位年轻企业家风度翩翩，在社交场合很受欢迎。","tags":["人物","褒义","气质"],"story":"《史记》记载平原君赵胜翩翩浊世之佳公子也，形容他在乱世中仍保持优雅的风度和气度。","usage":"用于赞美男子举止优雅、风度不凡。"},{"idiom":"神采奕奕","pinyin":"shen cai yi yi","meaning":"形容精神饱满、容光焕发。","source":"明·冯梦龙《醒世恒言》","example":"老人虽然年过八十，但依然神采奕奕。","tags":["人物","褒义","状态"],"story":"《醒世恒言》中描写一位老神仙神采奕奕、精神焕发的样子，形容人精力充沛、精神状态极佳。","usage":"用于赞美精神饱满、容光焕发的样子。"},{"idiom":"安居乐业","pinyin":"an ju le ye","meaning":"安定地生活，愉快地工作。","source":"《后汉书·仲长统传》","example":"让百姓安居乐业是政府的首要职责。","tags":["褒义","社会","生活"],"story":"仲长统在《昌言》中提出，治国理政的最高目标是让百姓安居乐业，各得其所。","usage":"用于形容人民生活安定、满足的状态。"},{"idiom":"丰衣足食","pinyin":"feng yi zu shi","meaning":"穿的吃的都很丰富充足，形容生活富裕。","source":"五代·王定保《唐摭言》","example":"经过多年奋斗，村民们过上了丰衣足食的生活。","tags":["褒义","社会","生活"],"story":"《唐摭言》中形容百姓生活富足时用丰衣足食来描述，指衣食物资都充裕，生活无忧。","usage":"用于形容生活富裕、吃穿不愁。"},{"idiom":"国泰民安","pinyin":"guo tai min an","meaning":"国家太平，人民安乐。","source":"宋·吴自牧《梦粱录》","example":"祈愿风调雨顺，国泰民安。","tags":["褒义","社会","祝福"],"story":"《梦粱录》中描绘了南宋时期杭州的繁荣景象，百姓安居乐业、社会和谐稳定，一派国泰民安的盛世气象。","usage":"用于祝福国家安定、人民幸福。"},{"idiom":"政通人和","pinyin":"zheng tong ren he","meaning":"政事通达，人心和顺，形容国家稳定、人民团结。","source":"宋·范仲淹《岳阳楼记》","example":"在政通人和的大好形势下，各地经济快速发展。","tags":["褒义","社会","政治"],"story":"范仲淹在《岳阳楼记》中写道：越明年，政通人和，百废具兴。描述滕子京治理巴陵郡后政治清明、百姓和乐的景象。","usage":"用于形容政治清明、社会和谐的局面。"},{"idiom":"长治久安","pinyin":"chang zhi jiu an","meaning":"国家长期安定、永久太平。","source":"《汉书·贾谊传》","example":"依法治国是实现社会长治久安的根本保障。","tags":["褒义","社会","政治"],"story":"贾谊在《治安策》中向汉文帝提出了实现国家长治久安的一系列政策建议，强调制度建设和法治的重要性。","usage":"用于形容国家长期稳定、社会持续安定的状态。"},{"idiom":"举世闻名","pinyin":"ju shi wen ming","meaning":"全世界都知道，形容非常著名。","source":"北齐·颜之推《颜氏家训》","example":"长城是举世闻名的建筑奇迹。","tags":["中性","社会","评价"],"story":"颜之推在《颜氏家训》中说：举世闻名，莫不钦仰。形容名声之大，全世界都知道。","usage":"用于形容在世界范围内都非常有名的人或事物。"},{"idiom":"家喻户晓","pinyin":"jia yu hu xiao","meaning":"家家户户都知道，形容人人皆知。","source":"宋·楼钥《缴郑熙等免罪》","example":"这个品牌在中国家喻户晓。","tags":["中性","社会","评价"],"story":"楼钥在奏章中写道：而欲使家喻户晓，岂不难哉？意思是让每家每户都知道，这件事做起来很困难。后形容广为人知。","usage":"用于形容知名度极高、人人都知道。"},{"idiom":"一丝一毫","pinyin":"yi si yi hao","meaning":"形容极小或极少的一点。","source":"《汉书·枚乘传》","example":"他对工作一丝一毫都不马虎。","tags":["中性","数量","形容"],"story":"枚乘在《谏吴王书》中以一丝一毫来形容极其微小的分量，强调即使是再小的细节也不能忽视。","usage":"用于强调最小单位的数量，常用于否定句。"},{"idiom":"分秒必争","pinyin":"fen miao bi zheng","meaning":"一分一秒都要争取，形容抓紧时间。","source":"《晋书·陶侃传》","example":"救援工作分秒必争，不能有丝毫耽搁。","tags":["褒义","时间","态度"],"story":"陶侃在广州做官时，每天把一百块砖搬到屋外再搬回来，以此锻炼意志。他常对人说：大禹圣人，乃惜寸阴，至于众人，当惜分阴。","usage":"用于形容抓紧时间、不浪费一分一秒。"},{"idiom":"刻不容缓","pinyin":"ke bu rong huan","meaning":"片刻也不能拖延，形容形势紧迫。","source":"清·李宝嘉《官场现形记》","example":"环境保护刻不容缓，必须立即行动。","tags":["中性","时间","警示"],"story":"《官场现形记》中描写了形势的紧迫性，一刻也不能拖延，必须立即采取行动，否则后果不堪设想。","usage":"用于强调事情非常紧急、必须立即处理。"},{"idiom":"事倍功半","pinyin":"shi bei gong ban","meaning":"花费的力气大而收到的成效小。","source":"《孟子·公孙丑上》","example":"方法不对，就会事倍功半。","tags":["贬义","方法","警示"],"story":"孟子说：故事半古之人，功必倍之。指做事只要方法得当，就能事半功倍。后人用反义的事倍功半来形容方法不当的后果。","usage":"用于形容方法不得当、费力不讨好的情况。"},{"idiom":"事半功倍","pinyin":"shi ban gong bei","meaning":"花费的力气小而收到的成效大。","source":"《孟子·公孙丑上》","example":"用对了方法，就能事半功倍。","tags":["褒义","方法","效率",{"idiom":"百读不厌","pinyin":"bai du bu yan","meaning":"反复阅读也不觉得厌倦。形容文章或书籍写得极好。","source":"宋·苏轼《送安惇秀才失解西归》","example":"这本经典名著让人百读不厌。","tags":["褒义","学习","文学"],"story":"苏轼在送别诗中说：旧书不厌百回读，熟读深思子自知。强调好的书读一百遍也不会厌倦，反而每次都有新的收获。","usage":"用于赞美经典作品或好文章值得反复阅读。"},{"idiom":"开卷有益","pinyin":"kai juan you yi","meaning":"打开书本就有好处，指读书总有收益。","source":"宋·王辟之《渑水燕谈录》","example":"开卷有益，多读书总没有坏处。","tags":["褒义","学习","哲理"],"story":"宋太宗命人编纂《太平御览》，每天坚持阅读三卷。有人劝他不要太劳累，他说：开卷有益，朕不以为劳也。","usage":"用于鼓励人们多读书、读好书。"},{"idiom":"满腹经纶","pinyin":"man fu jing lun","meaning":"一肚子学问和谋略，形容人饱学而有才略。","source":"明·冯惟敏《海浮山堂词稿》","example":"这位老教授满腹经纶，谈吐不凡。","tags":["褒义","学习","人物"],"story":"经纶原指整理丝线的技艺，后比喻治理国家的才能。满腹经纶形容人学问渊博、才华横溢。","usage":"用于赞美学识渊博、有经世之才的人。"},{"idiom":"出口成章","pinyin":"chu kou cheng zhang","meaning":"话说出口就成文章，形容文思敏捷、口才好。","source":"《诗经·大雅·烝民》","example":"他反应极快，每次发言都出口成章。","tags":["褒义","才能","人物"],"story":"《诗经》中赞美仲山甫：既明且哲，以保其身。夙夜匪懈，以事一人。后以出口成章来形容人思维敏捷、语言表达能力强。","usage":"用于赞美口才极好、说话有条理有文采的人。"},{"idiom":"才华横溢","pinyin":"cai hua heng yi","meaning":"才华充分显露出来。","source":"唐·李商隐《漫成五章》","example":"这位年轻作家才华横溢，作品广受欢迎。","tags":["褒义","才能","人物"],"story":"李商隐在诗中称赞友人才华横溢，比喻才华如水流般充盈而出、不可抑制。","usage":"用于赞美一个人非常有才华、才能出众。"},{"idiom":"能者多劳","pinyin":"neng zhe duo lao","meaning":"能干的人多劳碌。","source":"《列子·汤问》","example":"你是技术骨干，能者多劳嘛，多担待一些。","tags":["褒义","人物","工作"],"story":"《列子》中讲：能力强的人往往承担更多的工作，这是自然的道理。但也要注意适度，不能过度消耗。","usage":"用于称赞能力强的人承担更多工作，常用作客套话。"},{"idiom":"志同道合","pinyin":"zhi tong dao he","meaning":"志向相同，道路一致，形容彼此志趣相投。","source":"《三国志·魏书·陈思王植传》","example":"他们俩志同道合，一起创办了这家公司。","tags":["褒义","关系","合作"],"story":"曹植在给魏明帝的上疏中说：志同道合的人在一起，才能共同成就事业。强调志趣相投对合作的重要性。","usage":"用于形容有共同理想和追求的人走到一起。"},{"idiom":"语重心长","pinyin":"yu zhong xin chang","meaning":"话语恳切而有分量，情意深长。","source":"清·钱泳《履园丛话》","example":"老师语重心长地教导我们要珍惜时间。","tags":["褒义","沟通","态度"],"story":"《履园丛话》中描写长辈对晚辈的教诲，话语恳切、情意深长，让人深受感动。","usage":"用于形容长辈或上级对晚辈的恳切教导。"},{"idiom":"长篇大论","pinyin":"chang pian da lun","meaning":"滔滔不绝的言论或篇幅很长的文章。","source":"清·李宝嘉《官场现形记》","example":"他的发言长篇大论，听得大家都快睡着了。","tags":["中性","表达","写作"],"story":"《官场现形记》中描写一些官员开会时长篇大论、空话连篇，浪费大家时间。","usage":"用于形容讲话或文章篇幅过长，有时含贬义。"},{"idiom":"三番五次","pinyin":"san fan wu ci","meaning":"屡次，多次。","source":"元·戴善夫《风光好》","example":"我三番五次提醒他，他就是不听。","tags":["数字","中性","频率"],"story":"元代杂剧中常用三番五次来形容动作的反复进行，强调次数之频繁。","usage":"用于形容反复多次地做某事。"},{"idiom":"千方百计","pinyin":"qian fang bai ji","meaning":"想尽一切办法，用尽一切计谋。","source":"宋·朱熹《朱子语类》","example":"他千方百计地筹集资金，终于完成了项目。","tags":["数字","中性","方法"],"story":"朱熹在教学中说：学者要千方百计弄明白道理。后形容想尽各种办法。","usage":"用于形容想尽各种办法、用尽各种手段去做某事。"},{"idiom":"七上八下","p         '卧薪尝胆': '越王勾践被吴王夫差打败后，立志报仇。他睡在柴草上，吃饭前先尝苦胆，提醒自己不忘耻辱。经过十年生聚、十年教训，终于灭掉了吴国。',
        '三顾茅庐': '刘备听说诸葛亮是旷世奇才，就带上关羽张飞到隆中拜访。前两次都没见到，第三次终于见到了。诸葛亮被刘备的诚意打动，出山辅佐，成就了蜀汉大业。',
        '完璧归赵': '赵国得到和氏璧，秦王想用十五座城交换。蔺相如带着璧来到秦国，见秦王没有诚意，就设计让随从把璧悄悄送回赵国，自己留在秦国应对。最终完璧归赵，不辱使命。',
        '负荆请罪': '蔺相如因完璧归赵被拜为上卿，位在廉颇之上。廉颇不服气，多次羞辱蔺相如。蔺相如为了国家利益处处退让。廉颇知道后深感惭愧，光着上身背着荆条到蔺相如家请罪。两人从此成为好友。',
        '四面楚歌': '项羽被刘邦军队围困在垓下。夜里，汉军四面唱起楚地的民歌。项羽大惊：难道汉军已经占领了楚国全部土地吗？怎么楚人这么多？楚军听到家乡歌声，军心涣散，大势已去。',
        '破釜沉舟': '项羽率军过漳河后，下令把做饭的锅砸碎，把渡船凿沉，只带三天的干粮。以表示有进无退、必死的决心。将士们奋勇作战，最终大败秦军。',
        '项庄舞剑': '鸿门宴上，项羽的谋士范增想杀刘邦，让项庄在席间舞剑助兴，趁机刺杀刘邦。项伯看出意图，也拔剑起舞，用身体护住刘邦。这就是项庄舞剑意在沛公的由来。',
        '望梅止渴': '曹操带领军队行军，士兵们口渴难耐。曹操说：前面有一大片梅林，梅子又酸又甜，可以解渴。士兵们听了都流出口水，暂时缓解了口渴，坚持走到了有水源的地方。',
        '草木皆兵': '前秦苻坚率大军攻打东晋，在淝水之战中被谢玄击败。溃败中，苻坚回头看到八公山上的草木，以为都是晋军，吓得魂不附体。',
        '闻鸡起舞': '晋代祖逖年轻时和刘琨一起做官。两人都有远大志向，半夜听到鸡叫就起床练剑。后来祖逖率军北伐，收复了大量失地。',
        '入木三分': '王羲之在木板上写字，刻字的人发现墨汁渗入木板有三分深。形容他书法笔力雄健。现在多用来形容分析、见解深刻透彻。',
        '胸有成竹': '宋代画家文与可擅长画竹，他在院子里种了很多竹子，每天观察竹子的形态变化。久而久之，竹子的各种姿态都已深印心中，提笔就能画出逼真的竹子。',
        '百折不挠': '东汉官员乔玄为官刚正不阿，面对权贵的威胁利诱毫不动摇。一次他儿子被绑匪劫持，他坚决不妥协，最终虽然儿子被害，但他坚持原则的精神被后人称颂。',
        '居安思危': '春秋时期，晋国大臣魏绛劝谏晋悼公说：在安定的时候要想到可能发生的危险，有了准备才能避免祸患。晋悼公采纳了他的建议，国家长治久安。',
        '实事求是': '汉景帝的儿子刘德（河间献王）喜好学问，收藏了大量古籍。他研究学问注重考证，力求得到真实可靠的结论。班固在汉书中称赞他修学好古实事求是。',
        '脚踏实地': '宋代大儒邵雍一生治学严谨、处世踏实。他主张君子之学以脚踏实地为贵。他教学生要一步步来，不可好高骛远。',
        '塞翁失马': '边塞有位老人，他的马跑到了胡人那边。邻居来安慰他，他说：这未必是坏事。几个月后，那匹马带着胡人的骏马回来了。儿子骑马摔断了腿，老人又说：这未必是坏事。后来征兵打仗，儿子因腿伤免去了兵役。',
        '邯郸学步': '燕国寿陵有个少年听说邯郸人走路姿势优美，就去邯郸学习。他整天观察模仿邯郸人走路，结果不仅没学会，反而连自己原来怎么走路都忘了，只好爬着回家。',
        '锲而不舍': '荀子在劝学中用雕刻作比喻：雕刻一下就放弃，连朽木也刻不断；坚持不懈地雕刻，金石也能刻出花纹。强调持之以恒的重要性。',
        '水滴石穿': '枚乘在谏吴王书中写道：水滴不断地滴，能把石头滴穿。屋檐下的石头，天长日久就会被滴出坑来。说明积累的力量是巨大的。',
        '集思广益': '诸葛亮在教与军师长史参军掾属中鼓励下属积极提建议：要集中大家的智慧，广泛吸取有益的意见，这样才能把事情做好。',
        '乐不思蜀': '蜀汉灭亡后，后主刘禅被迁到洛阳。司马昭设宴招待他，让人表演蜀地歌舞。别人都感到悲伤，刘禅却谈笑自如。司马昭问他想不想蜀地，他说：这里很快乐，不想蜀地了。',
        '同甘共苦': '燕昭王想振兴燕国，郭隗告诉他：要想让贤才来投奔，就要与百姓同甘共苦。燕昭王于是放下君王架子，与百姓同甘共苦，燕国果然强大起来。',
        '一帆风顺': '唐代诗人孟郊在送别朋友的诗中写道：祝愿你一路顺利，如顺风行驶的船一样。后来这个比喻广泛用于祝福他人事业顺利。',
        '不耻下问': '孔子的学生子贡问：孔文子为什么被谥为文？孔子说：他聪明好学，又不以向不如自己的人请教为耻，所以谥号为文。',
        '举一反三': '孔子说：我举出一个方面，学生不能由此推知另外三个方面，我就不再教他了。强调学习中触类旁通、灵活运用能力的重要性。',
        '温故知新': '孔子说：温习旧的知识，能够从中得到新的理解和体会，这样的人就可以做老师了。强调复习和反思的重要性。',
        '千里之行始于足下': '老子在道德经中说：千里的远行，从脚下第一步开始。无论多么宏大的事业，都要从一点一滴做起。',
        '百闻不如一见': '汉朝将领赵充国要去平定羌人叛乱，汉宣帝问他需要多少兵力。赵充国说：百闻不如一见，让我先去前线实地考察后再定方案。',
        '半途而废': '东汉乐羊子外出求学一年就回家了。妻子用刀割断织布机上的绢布说：你中途放弃学业，就像我割断织好的布一样前功尽弃。乐羊子深受感动，回去继续求学，七年不归。',
        '杯水车薪': '孟子说：仁能战胜不仁，就像水能灭火一样。但现在行仁的人太少，就像用一杯水去救一车柴草的大火，火灭不了就说水不能灭火。',
        '闭门造车': '朱熹原意是说：关起门来造车，出门也能合辙，因为规矩是一样的。后来演变为贬义，比喻脱离实际、凭主观想象做事。',
        '鞭长莫及': '楚庄王派申舟出使齐国，申舟途经宋国时被杀。楚庄王要攻打宋国，宋国向晋国求救。晋伯宗劝阻说：虽鞭之长不及马腹。即使鞭子再长也打不到马肚子，我们管不了那么远。',
        '宾至如归': '子产到晋国拜访，晋国没有妥善安排住处。子产就让人拆了使馆的墙，让自己的车马进入。晋君派人质问，子产说：我们听说晋文公做盟主时使馆修得很好，宾客到此如回家一样。',
        '不寒而栗': '汉武帝时酷吏义纵执法严酷，在定襄一天就处死了四百多名犯人。消息传开，百姓不冷也发抖，恐惧万分。',
        '不劳而获': '孔子说：君子做官靠的是勤劳和才能，而不是靠不劳而获。不劳而获的行为是可耻的。正如农民不耕种就不会有收获一样。',
        '不谋而合': '干宝在搜神记中说：两人虽然没有商量过，但想法却完全一致，这说明道理是相通的。',
        '不可思议': '原为佛教用语，指思维无法到达的境界。洛阳伽蓝记中描述佛法的精妙不可思议。后用来形容难以想象的事情。',
        '不求甚解': '陶渊明在五柳先生传中自称好读书不求甚解，意思是读书重在领会精神，不在一字一句上过分深究。后来多用于贬义。',
        '不屈不挠': '汉成帝时，王商任丞相，为人正直。大将军王凤专权，王商不屈服于他的压力。虽然最终被害，但其不屈不挠的精神被载入史册。',
        '不速之客': '周易需卦中说：不速之客三人来敬之终吉。意思是没被邀请的客人来了只要以礼相待最终是吉利的。',
        '不言而喻': '孟子说：君子所行的仁义礼智不需要言语解释人们自然能够理解。这些德行根植于心自然流露于外不言而喻。',
        '不翼而飞': '战国策士说：君主的名声没有翅膀却可以飞到千里之外说明名声传播之快。后多用于形容物品突然丢失。',
        '不由自主': '红楼梦中描写贾宝玉听说林黛玉要回苏州时不由自主地发起呆来表现出无法控制自己情感的失态。',
        '层出不穷': '韩愈在孟郊墓志铭中写道：孟郊的诗文高深莫测形态变化层出不穷令人目不暇接。',
        '差强人意': '东汉大将吴汉在作战不利时仍镇定自若整顿兵器激励将士。刘秀听说后感叹道：吴公差强人意总算还能振奋人心。',
        '陈词滥调': '指陈旧空泛的言论。古代文人以陈言务去为追求韩愈提出惟陈言之务去反对使用陈旧的语言和观点。',
        '乘风破浪': '南朝宋人宗悫少年时叔父问他的志向他说愿乘长风破万里浪。后来他果然成为一位名将为国家立下赫赫战功。',
        '出类拔萃': '孟子说：麒麟对于走兽凤凰对于飞鸟泰山对于土堆河海对于水坑都是同类。圣人对百姓也是同类但远远超出了同类这就是出类拔萃。',
        '触类旁通': '周易系辞上说：学习要能触类旁通由一件事推知同类事物的规律。这是古代重要的学习方法论。',
        '唇亡齿寒': '晋献公向虞国借路攻打虢国。宫之奇劝虞君说：虢国是虞国的屏障虢国灭亡了虞国也保不住。就像嘴唇没了牙齿就会感到寒冷一样。虞君不听果然晋国灭虢后顺路灭了虞国。',
        '从容不迫': '庄子秋水中说：庄子在濮水钓鱼楚王派使者去请他做官。庄子拿着鱼竿头也不回从容不迫地说：我宁愿在泥水里自由自在地生活。',
        '大材小用': '辛弃疾被贬官后有人为他抱不平认为朝廷把他这样的大才用在闲职上是大材小用。辛弃疾自己也感叹：我是用错了地方。',
        '大刀阔斧': '水浒传中描写梁山好汉作战时大刀阔斧地杀入敌阵形容勇猛果敢。后引申为做事果断有魄力。',
        '大功告成': '刘秀建立东汉后群臣上表称：陛下大功告成天下归心。原指统一天下的大业完成后泛指重要任务圆满完成。',
        '大惊小怪': '朱熹在给学生的信中说：对于平常的事情不要大惊小怪要保持平和的心态对待一切变化。',
        '大器晚成': '老子在道德经中说：贵重的器物需要很长时间才能制成。比喻有大才能的人成就较晚需要经历更多磨练。',
        '大势所趋': '陈亮在给宋孝宗的上书中力主北伐收复失地。他说：天下大势所趋人心所向不可阻挡。提醒皇帝顺应历史潮流。',
        '大同小异': '庄子天下中说：百家之学大同小异。意思是各家学说大体相同只是细微处有差异。',
        '当务之急': '孟子说：当前最急切要做的事就是仁政。作为君主要知道什么事情是最紧迫的优先处理最重要的事。',
        '得意忘形': '阮籍是竹林七贤之一他嗜酒能啸善弹琴。当其得意忽忘形骸。形容他高兴时忘乎所以不拘形迹的状态。',
        '独当一面': '张良对刘邦说：韩信可以独当一面让他去开辟北方战场。刘邦采纳了建议韩信果然在北方连战连捷。',
        '咄咄逼人': '东晋女书法家卫铄（卫夫人）在论书法时说：用笔要刚柔并济如果一味刚劲咄咄逼人反而不美。后比喻气势逼人。',
        '耳濡目染': '韩愈在为房公写的墓志铭中说：他从小耳濡目染受父辈的影响自然学会了为官之道。',
        '耳目一新': '北魏元澄上书建议改革提到国家经过整顿后面貌焕然一新让人耳悦目新。后用来形容事物变化带来的新鲜感。',
        '发扬光大': '黄榦（朱熹弟子）在书信中说：先圣的学问需要后人不断发扬光大使其更加辉煌。',
        '翻天覆地': '刘商在胡笳十八拍中写蔡文姬被掳到匈奴的痛苦：天地翻覆命运多舛。后形容巨大的变化。',
        '防微杜渐': '丁鸿上书汉和帝说：帝王应该在坏事刚露苗头时就加以防范不要让小问题变成大祸患。这就是防微杜渐的道理。',
        '废寝忘食': '孔子在齐国听到韶乐陶醉其中三个月不知道肉的滋味。他说：为了学习废寝忘食乐以忘忧不知道老之将至。',
        '奋发图强': '孔子说：年轻人应当奋发向上努力自强。后世用奋发图强鼓励人们在困难面前振作精神努力进取。',
        '风餐露宿': '苏轼被贬途中写诗给侄子们描述自己在路上的艰苦：在风里吃饭在露天住宿非常辛苦。',
        '风吹草动': '伍子胥逃亡途中风声鹤唳任何风吹草动都让他高度警惕。后用来比喻轻微的动静或变故。',
        '风雨同舟': '孙子说：让士兵陷入绝境才能激发斗志就像在暴风雨中同船渡河的人遇到危险自然会同心协力。后喻共同面对困难。',
        '釜底抽薪': '古代有一锅水烧开了扬汤只能暂时止沸。如果从锅底抽掉柴火从根本上消除沸腾的原因才是解决问题的办法。',
        '赴汤蹈火': '荀子说：如果君主以仁义治国士兵就会心甘情愿为他赴汤蹈火在所不辞。形容不惧任何艰难险阻。',
        '覆水难收': '姜太公早年妻子嫌他穷离开了他。后来他辅佐周王功成名就前妻想回来。姜太公把一盆水泼在地上说：泼出去的水还能收回来吗？比喻事已至此无法挽回。',
        '刚愎自用': '楚庄王攻打郑国晋国派兵救援。晋军主帅先縠不听副帅的劝告一意孤行结果大败。先縠就是因为刚愎自用导致失败。',
        '高枕无忧': '孟尝君的门客冯谖为他到薛地收债却把债券烧了。孟尝君不高兴后来被罢官回到薛地百姓热烈欢迎。冯谖说：现在你可以高枕无忧了但这还不够稳固还需要更多准备。',
        '功亏一篑': '尚书中说：堆一座九仞高的土山只差最后一筐土就完成了如果停止不干就前功尽弃。做事要善始善终不能半途而废。',
        '勾心斗角': '杜牧阿房宫赋中各抱地势勾心斗角原指宫殿建筑结构精巧错落有致。后来演变为贬义指人与人之间互相算计。',
        '孤注一掷': '契丹入侵寇准力劝宋真宗亲征。打败契丹后真宗更信任寇准。王钦若嫉妒地说：陛下听说过赌博吗？赌徒快输光时会把所有钱押上这叫孤注。寇准就是把陛下当作孤注一掷。',
        '顾全大局': '二十年目睹之怪现状中描写人物处事时以大局为重不因个人得失影响整体利益。',
        '顾名思义': '王昶在戒子侄书中说：给孩子起名要慎重让人看到名字就联想到应有的品德。如默寓意沉静沉寓意深沉。',
        '过河拆桥': '元朝彻里帖木儿上书说：有些官员利用完百姓的支持后就过河拆桥不再关心百姓疾苦。',
        '过犹不及': '子贡问孔子：子张和子夏谁更好？孔子说：子张过了头子夏还没达到。子贡问：那子张更好？孔子说：过了头就和不够一样不好。',
        '害群之马': '黄帝去具茨山遇到一个放马的孩子问他治理天下的方法。孩子说：治理天下就像放马只要除去害群之马就行了。黄帝深受启发。',
        '含沙射影': '传说有一种叫蜮的动物在水中含沙射人的影子被射中的人会生病甚至死亡。后比喻暗中攻击陷害。',
        '好高骛远': '程颢（北宋理学家）教导学生说：做学问要脚踏实地不要好高骛远。从基础做起循序渐进。',
        '合情合理': '二十年目睹之怪现状中写道：做事情要合情合理不能违背人情和道理。后广泛用于评价事物的合理性。',

    enrichIdiomData();

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabIdiom').className = tab === 'idiom' ? 'px-3 py-1 bg-blue-500 text-white rounded text-sm' : 'px-3 py-1 bg-gray-200 rounded text-sm';
      document.getElementById('tabXiehouyu').className = tab === 'xiehouyu' ? 'px-3 py-1 bg-blue-500 text-white rounded text-sm' : 'px-3 py-1 bg-gray-200 rounded text-sm';
      search();
    }

    function search() {
      const query = document.getElementById('searchInput').value.trim();
      const data = currentTab === 'idiom' ? idiomData : xiehouyuData;
      const results = data.filter(item => {
        const text = currentTab === 'idiom' ? `${item.idiom}${item.pinyin}${item.meaning}${item.tags.join('')}` : `${item.riddle}${item.answer}${item.explanation}${item.category}`;
        return text.includes(query);
      });

      const container = document.getElementById('results');
      if (results.length === 0) {
        container.innerHTML = '<div class="bg-white rounded shadow p-6 text-center text-gray-500">没有找到匹配结果</div>';
        return;
      }

      container.innerHTML = results.map(item => {
        if (currentTab === 'idiom') {
          return `<div class="bg-white rounded shadow p-4 hover:shadow-md transition" onclick="showDetail('${item.idiom}')">
            <div class="flex items-baseline gap-3">
              <span class="text-xl font-bold">${item.idiom}</span>
              <span class="text-gray-400 text-sm">${item.pinyin}</span>
              <button onclick="event.stopPropagation(); speakIdiom('${item.idiom}')" class="bg-indigo-100 text-indigo-600 px-2 py-0.5 rounded text-xs hover:bg-indigo-200">
                <i class="fa fa-volume-up"></i>
              </button>
              ${item.tags.map(t => `<span class="text-xs px-2 py-0.5 bg-blue-100 rounded">${t}</span>`).join('')}
            </div>
            <p class="text-gray-600 text-sm mt-1">${item.meaning}</p>
          </div>`;
        } else {
          return `<div class="bg-white rounded shadow p-4 hover:shadow-md transition">
            <div class="flex items-baseline gap-3">
              <span class="text-xl font-bold">${item.riddle}</span>
              <span class="text-green-600 font-medium">→ ${item.answer}</span>
              <span class="text-xs px-2 py-0.5 bg-yellow-100 rounded">${item.category}</span>
            </div>
            <p class="text-gray-500 text-sm mt-1">${item.explanation}</p>
          </div>`;
        }
      }).join('');
    }

    function showDetail(idiom) {
      const item = idiomData.find(i => i.idiom === idiom);
      if (!item) return;
      // 确保有story和usage字段
      const story = item.story || '典故故事暂缺，欢迎补充。';
      const usage = item.usage || '使用场景暂缺，欢迎补充。';
      document.getElementById('results').innerHTML = `<div class="bg-gradient-to-r from-blue-50 to-indigo-50 rounded-lg shadow p-6">
        <div class="flex items-center gap-3 mb-2">
          <span class="text-3xl font-bold">${item.idiom}</span>
          <button onclick="speakIdiom('${item.idiom}')" class="bg-indigo-500 text-white px-3 py-1 rounded-full hover:bg-indigo-600 text-sm">
            <i class="fa fa-volume-up"></i> 朗读
          </button>
        </div>
        <div class="text-gray-400 mb-4">${item.pinyin}</div>
        <div class="text-lg mb-4">${item.meaning}</div>
        <div class="text-gray-500 italic mb-4">例句：${item.example}</div>
        <div class="text-sm text-gray-400">出处：${item.source}</div>
        <div class="mt-2">${item.tags.map(t => `<span class="text-xs px-2 py-0.5 bg-blue-100 rounded">${t}</span>`).join(' ')}</div>
        <!-- 详解区域 -->
        <div class="mt-4 pt-4 border-t border-blue-200">
          <div class="flex items-center gap-2 mb-2">
            <i class="fa fa-book text-purple-500"></i>
            <span class="font-medium text-purple-700">典故故事</span>
          </div>
          <p class="text-gray-600 text-sm bg-purple-50 p-3 rounded">${story}</p>
        </div>
        <div class="mt-3">
          <div class="flex items-center gap-2 mb-2">
            <i class="fa fa-lightbulb-o text-yellow-500"></i>
            <span class="font-medium text-yellow-700">使用场景</span>
          </div>
          <p class="text-gray-600 text-sm bg-yellow-50 p-3 rounded">${usage}</p>
        </div>
        <button onclick="addToFavorite('${item.idiom}', 'idiom')" class="mt-4 text-sm text-blue-500 hover:text-blue-700"><i class="fa fa-heart"></i> 收藏</button>
      </div>`;
    }

    function randomIdiom() {
      const data = currentTab === 'idiom' ? idiomData : xiehouyuData;
      const item = data[Math.floor(Math.random() * data.length)];
      if (currentTab === 'idiom') {
        showDetail(item.idiom);
      } else {
        document.getElementById('results').innerHTML = `<div class="bg-gradient-to-r from-yellow-50 to-orange-50 rounded-lg shadow p-6 text-center">
          <div class="text-2xl font-bold mb-2">${item.riddle}</div>
          <div class="text-xl text-green-600 font-medium mb-4">→ ${item.answer}</div>
          <div class="text-gray-600">${item.explanation}</div>
          <button onclick="addToFavorite('${item.riddle}', 'xiehouyu')" class="mt-3 text-sm text-blue-500 hover:text-blue-700"><i class="fa fa-heart"></i> 收藏</button>
        </div>`;
      }
    }

    // localStorage收藏功能
    const favKey = 'idiom_favorites';
    function getFavorites() { return JSON.parse(localStorage.getItem(favKey) || '[]'); }
    function saveFavorites(list) { localStorage.setItem(favKey, JSON.stringify(list)); }
    function addToFavorite(name, type) {
      const favs = getFavorites();
      if (!favs.find(f => f.name === name)) {
        favs.push({ name, type, time: new Date().toISOString() });
        saveFavorites(favs);
        alert('已收藏: ' + name);
      } else {
        alert('已在收藏列表中');
      }
    }
    function showFavorites() {
      const favs = getFavorites();
      if (favs.length === 0) {
        document.getElementById('results').innerHTML = '<div class="bg-white rounded shadow p-6 text-center text-gray-500">暂无收藏</div>';
        return;
      }
      document.getElementById('results').innerHTML = favs.map(f => `<div class="bg-white rounded shadow p-4">
        <span class="font-bold">${f.name}</span>
        <span class="text-xs text-gray-400">${f.type === 'idiom' ? '成语' : '歇后语'}</span>
        <span class="text-xs text-gray-400 ml-2">${new Date(f.time).toLocaleDateString()}</span>
      </div>`).join('');
    }

    // Web Speech API 朗读功能
    function speakIdiom(text) {
      if ('speechSynthesis' in window) {
        // 先停止正在进行的朗读
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.8;
        utterance.pitch = 1;
        window.speechSynthesis.speak(utterance);
      } else {
        alert('您的浏览器不支持语音朗读功能');
      }
    }

    function searchTag(tag) {
      document.getElementById('searchInput').value = '';
      switchTab('idiom');
      const results = idiomData.filter(i => i.tags.includes(tag));
      const container = document.getElementById('results');
      container.innerHTML = results.map(item => `<div class="bg-white rounded shadow p-4 hover:shadow-md transition" onclick="showDetail('${item.idiom}')">
        <div class="flex items-baseline gap-3">
          <span class="text-xl font-bold">${item.idiom}</span>
          <span class="text-gray-400 text-sm">${item.pinyin}</span>
        </div>
        <p class="text-gray-600 text-sm mt-1">${item.meaning}</p>
      </div>`).join('');
    }

    // Initial load
    search();
  </script>
